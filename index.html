<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#47B0FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Valdoria · Guerra de Cartas</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
<div class="loading" id="loading"><h2>Valdoria</h2><div class="lb"><i id="lb-i"></i></div><p id="lb-t">Carregando a arte…</p></div>
<div class="app">

  <section id="v-home">
    <button class="btn small fsb" id="fs-home" type="button">⛶ Tela cheia</button>
    <div class="logo">
      <h1>Valdoria</h1>
      <div class="ribbon">Guerra de Cartas</div>
    </div>
    <div class="heroWrap"><canvas id="hero" width="780" height="330" aria-hidden="true"></canvas></div>
    <div class="menu">
      <button class="big hot" id="go-battle" type="button"><img id="img-battle" alt="" width="64" height="64"><span>Batalha<small id="home-main">Máquina ou online</small></span></button>
      <button class="big cool" id="go-editor" type="button"><img id="img-editor" alt="" width="64" height="64"><span>Meus decks<small>Monte até 5 baralhos</small></span></button>
    </div>
    <div class="deckstrip"><b id="home-deckname">Deck principal</b><div class="faces" id="home-faces"></div></div>
    <p class="note" id="save-note"></p>
  </section>

  <section id="v-editor" hidden>
    <div class="topbar"><button class="btn small" id="ed-back" type="button">‹ Início</button><h2>Meus decks</h2></div>
    <div class="edwrap"><div class="edL">
    <div class="slots" id="slots" role="group" aria-label="Vagas de deck"></div>
    <div class="row" style="margin-top:10px">
      <input class="txt" id="dname" maxlength="16" aria-label="Nome do deck" style="flex:1 1 140px;width:auto">
      <button class="btn small go" id="setmain" type="button">★ Principal</button>
    </div>
    <div class="stats" id="stats"></div>
    <ul class="msgs" id="msgs"></ul>
    <div class="row">
      <button class="btn small cool" id="rand" type="button">🎲 Montar aleatório</button>
      <button class="btn small" id="clear" type="button">Limpar</button>
    </div>
    <p class="note" id="ed-note" style="text-align:left"></p>
    </div><div class="edR"><div id="pool"></div></div></div>
  </section>

  <section id="v-bmenu" hidden>
    <div class="topbar"><button class="btn small" id="bm-back" type="button">‹ Início</button><h2>Batalha</h2><button class="btn small" id="bm-edit" type="button">Editar decks</button><button class="btn hot" id="bm-start" type="button">⚔️ Iniciar</button></div>
    <div id="bm-body"></div>
    <p class="note" id="bm-note"></p>
  </section>

  <section id="v-game" hidden>
    <aside class="side" id="side0"></aside>
    <div class="mid">
      <div class="hud">
        <button class="btn small" id="g-quit" type="button">✕</button>
        <div class="hb"><span id="n0">Você</span><div class="bar"><i id="hp-me"></i></div></div>
        <div class="clock" id="clock">3:00</div>
        <div class="hb foe"><span id="n1">Rival</span><div class="bar"><i id="hp-foe"></i></div></div>
        <button class="btn small fsb" id="g-fs" type="button" style="margin:0" aria-label="Tela cheia">⛶</button>
      </div>
      <div class="arena" id="arena">
        <canvas id="cv" aria-label="Campo de batalha"></canvas>
        <div class="pbar" id="pbar" hidden></div>
        <div class="banner" id="banner" hidden><h3></h3><p></p></div>
      </div>
    </div>
    <aside class="side r" id="side1" hidden></aside>
  </section>

</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>if(typeof Peer==='undefined'){ document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>'); }</script>
<script src="js/logic.js?v=1"></script>
<script src="js/sprites.js?v=1"></script>
<script src="js/net.js?v=1"></script>
<script src="js/scenery.js?v=1"></script>
<script src="js/ui-core.js?v=1"></script>
<script src="js/ui-home.js?v=1"></script>
<script src="js/ui-editor.js?v=1"></script>
<script src="js/ui-menu.js?v=1"></script>
<script src="js/ui-battle.js?v=1"></script>
<script src="js/render.js?v=1"></script>
<script src="js/main.js?v=1"></script>
</body>
</html>
