<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#47B0FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Valdoria · Guerra de Cartas</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#47B0FF; --sky2:#FFE3A0; --hill1:#58C25F; --hill2:#3FA84E;
  --ink:#2A1A3D; --muted:#6B5A86; --panel:#FFF4DA; --panel2:#FFFFFF;
  --line:#2A1A3D; --shadow:#2A1A3D; --gold:#FFC83D; --blue:#3A7BFF; --red:#FF4D4D;
  --hot1:#FF9446; --hot2:#FF3D5A; --cool1:#9468FF; --cool2:#5A3DE0; --good1:#4BDB7A; --good2:#1FA85A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#272766; --sky2:#B04F7E; --hill1:#2E8C4A; --hill2:#237040;
    --ink:#FFF4DA; --muted:#D3C8EE; --panel:#3F3585; --panel2:#4E429C;
    --line:#140D30; --shadow:#140D30;
  }
}
:root[data-theme="dark"]{
  --sky1:#272766; --sky2:#B04F7E; --hill1:#2E8C4A; --hill2:#237040;
  --ink:#FFF4DA; --muted:#D3C8EE; --panel:#3F3585; --panel2:#4E429C;
  --line:#140D30; --shadow:#140D30;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; min-height:100vh; color:var(--ink);
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%) fixed;
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; font-size:17px; line-height:1.35; font-weight:700;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3{font-family:'Lilita One','Arial Rounded MT Bold','Arial Black',system-ui,sans-serif; font-weight:400; margin:0; line-height:1.05}
.app{max-width:560px; margin:0 auto; padding:14px 14px 28px}

/* botões */
.btn{
  font:inherit; font-weight:800; color:var(--ink); background:var(--panel); cursor:pointer;
  border:3px solid var(--line); border-radius:12px; padding:7px 14px; min-height:42px;
  box-shadow:0 4px 0 var(--shadow); transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--shadow)}
.btn:disabled{opacity:.5; cursor:default}
.btn.hot,.btn.cool,.btn.go{color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.hot{background:linear-gradient(180deg,var(--hot1),var(--hot2))}
.btn.cool{background:linear-gradient(180deg,var(--cool1),var(--cool2))}
.btn.go{background:linear-gradient(180deg,var(--good1),var(--good2))}
.btn.small{min-height:36px; padding:4px 11px; font-size:.9rem}
.btn:focus-visible,.ct .main:focus-visible,.slot:focus-visible,.hc:focus-visible,.chip:focus-visible,.big:focus-visible,.dk:focus-visible,.txt:focus-visible,.info:focus-visible{outline:4px solid #fff; outline-offset:2px}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.muted{color:var(--muted)}
.topbar{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.topbar h2{font-size:1.9rem; flex:1; color:#fff; -webkit-text-stroke:5px var(--line); paint-order:stroke fill; text-shadow:0 3px 0 var(--line)}

/* início */
.logo{text-align:center; padding:10px 0 0}
.logo h1{
  font-size:clamp(3.2rem,18vw,5rem); letter-spacing:.03em; color:#FFD23F;
  -webkit-text-stroke:8px var(--line); paint-order:stroke fill; text-shadow:0 6px 0 var(--line);
}
.ribbon{
  display:inline-block; margin-top:6px; padding:3px 26px 4px; background:linear-gradient(180deg,var(--hot1),var(--hot2));
  color:#fff; border:3px solid var(--line); border-radius:8px; transform:rotate(-2deg);
  font-family:'Lilita One',system-ui,sans-serif; font-size:1.3rem; letter-spacing:.04em; text-shadow:0 2px 0 rgba(0,0,0,.35); box-shadow:0 4px 0 var(--shadow);
}
.heroWrap{position:relative; margin:4px -14px 0}
#hero{display:block; width:100%; height:auto}
.menu{display:grid; gap:14px; margin-top:-6px; position:relative}
.big{
  display:flex; align-items:center; gap:12px; width:100%; padding:10px 16px; cursor:pointer; text-align:left;
  border:3px solid var(--line); border-radius:20px; color:#fff; font-family:'Lilita One','Arial Black',system-ui,sans-serif; font-size:1.9rem;
  text-shadow:0 3px 0 rgba(0,0,0,.35); box-shadow:0 7px 0 var(--shadow); letter-spacing:.02em;
}
.big:active{transform:translateY(4px); box-shadow:0 3px 0 var(--shadow)}
.big.hot{background:linear-gradient(180deg,var(--hot1),var(--hot2))}
.big.cool{background:linear-gradient(180deg,var(--cool1),var(--cool2))}
.big img{width:64px; height:64px; flex:none; filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.big small{display:block; font-family:'Nunito',system-ui,sans-serif; font-weight:800; font-size:.88rem; text-shadow:0 1px 0 rgba(0,0,0,.4); letter-spacing:0}
.deckstrip{margin-top:16px; padding:10px 12px; background:var(--panel); border:3px solid var(--line); border-radius:16px; box-shadow:0 4px 0 var(--shadow)}
.deckstrip b{display:block; font-family:'Lilita One',system-ui,sans-serif; font-weight:400; font-size:1.1rem}
.faces{display:flex; flex-wrap:wrap; gap:2px; margin-top:4px}
.faces img{width:34px; height:34px}
.note{margin:12px 2px 0; font-size:.85rem; color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.5); text-align:center}

/* editor */
.slots{display:flex; gap:6px}
.slot{flex:1; font:inherit; font-family:'Lilita One',system-ui,sans-serif; font-size:1.2rem; padding:6px 0; border:3px solid var(--line); border-radius:12px; background:var(--panel); color:var(--ink); cursor:pointer; box-shadow:0 3px 0 var(--shadow)}
.slot.on{background:linear-gradient(180deg,#FFE066,var(--gold))}
.txt{font:inherit; font-weight:800; border:3px solid var(--line); border-radius:12px; padding:7px 10px; min-height:42px; background:var(--panel2); color:var(--ink); width:100%}
.stats{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0}
.stat{border:2.5px solid var(--line); border-radius:999px; padding:2px 10px; font-weight:800; font-size:.85rem; background:var(--panel)}
.stat.bad{background:var(--hot2); color:#fff}
.stat.ok{background:var(--good1); color:#0F2A18}
.msgs{margin:0 0 10px; padding:0; list-style:none; display:grid; gap:4px; font-size:.9rem}
.msgs li{padding:6px 10px; border-radius:10px; background:var(--panel); border:2.5px solid var(--line)}
.msgs li.err{border-left:8px solid var(--hot2)}
.msgs li.warn{border-left:8px solid var(--gold)}
.grp{margin:18px 0 10px; font-size:1.4rem; color:#fff; -webkit-text-stroke:4px var(--line); paint-order:stroke fill; text-shadow:0 2px 0 var(--line)}
.pool{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.ct{position:relative}
.t-tropa{--cc:#4F8CFF} .t-constr{--cc:#FF9A2E} .t-armad{--cc:#9B5CFF} .t-feitico{--cc:#19B8A6}
.ct .main{
  width:100%; display:grid; justify-items:center; gap:0; padding:6px 4px 6px; font:inherit; color:var(--ink); cursor:pointer;
  background:var(--panel2); border:3px solid var(--line); border-radius:14px; box-shadow:0 4px 0 var(--shadow); overflow:hidden;
}
.ct .art{width:100%; aspect-ratio:1; border-radius:10px; background:radial-gradient(circle at 50% 40%,#fff6,transparent 70%),var(--cc); display:grid; place-items:center}
.ct .art img{width:88%; height:88%}
.ct .nm{font-weight:800; font-size:.82rem; text-align:center; line-height:1.1; margin-top:4px}
.ct.in .main{outline:4px solid var(--gold); outline-offset:1px; transform:translateY(2px); box-shadow:0 2px 0 var(--shadow)}
.ct .co{position:absolute; top:-8px; left:-6px; min-width:28px; height:28px; padding:0 4px; border-radius:50%; background:linear-gradient(180deg,#B58CFF,#6A3DE0); color:#fff; font-family:'Lilita One',system-ui,sans-serif; font-size:1.05rem; display:grid; place-items:center; border:3px solid var(--line)}
.ct .tag{position:absolute; top:-8px; left:-6px; border-radius:10px; background:var(--cc); color:#fff; font-size:.65rem; padding:2px 6px; border:3px solid var(--line); text-shadow:0 1px 0 rgba(0,0,0,.4)}
.ct .info{position:absolute; top:-8px; right:-6px; width:28px; height:28px; border-radius:50%; border:3px solid var(--line); background:var(--panel2); color:var(--ink); font:inherit; font-weight:800; font-size:.85rem; cursor:pointer; padding:0}
.ct .tick{position:absolute; bottom:30px; right:8px; width:24px; height:24px; border-radius:50%; background:var(--good1); border:3px solid var(--line); color:#0F2A18; display:grid; place-items:center; font-weight:800; font-size:.8rem}

/* menu de batalha */
.decks{display:grid; gap:10px; margin:12px 0}
.dk{
  text-align:left; display:grid; gap:2px; padding:8px 12px; font:inherit; color:var(--ink); cursor:pointer;
  background:var(--panel); border:3px solid var(--line); border-radius:16px; box-shadow:0 4px 0 var(--shadow);
}
.dk.on{background:linear-gradient(180deg,#FFE066,var(--gold)); color:#2A1A3D}
.dk:disabled{opacity:.6; cursor:default}
.dk b{font-family:'Lilita One',system-ui,sans-serif; font-weight:400; font-size:1.15rem}
.dk .faces img{width:30px; height:30px}
.dk small{font-size:.85rem}
.panelnote{padding:8px 12px; border-radius:12px; background:var(--panel); border:3px solid var(--line)}

/* jogo */
.hud{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; margin-bottom:8px}
.hb{display:grid; gap:2px; font-weight:800; font-size:.85rem; color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.6)}
.hb.foe{text-align:right}
.bar{height:12px; border:3px solid var(--line); border-radius:8px; background:var(--panel); overflow:hidden}
.bar i{display:block; height:100%; width:100%; background:linear-gradient(180deg,#78A8FF,var(--blue))}
.hb.foe .bar i{background:linear-gradient(180deg,#FF8A8A,var(--red))}
.clock{font-family:'Lilita One',system-ui,sans-serif; font-size:1.7rem; min-width:70px; text-align:center; color:#fff; -webkit-text-stroke:4px var(--line); paint-order:stroke fill}
.arena{position:relative; width:max-content; max-width:100%; margin:0 auto}
canvas#cv{display:block; border:4px solid var(--line); border-radius:14px; touch-action:none; background:#7FB069; box-shadow:0 5px 0 var(--shadow)}
.banner{
  position:absolute; inset:0; display:grid; place-content:center; text-align:center; gap:6px; padding:10px;
  background:rgba(30,15,50,.6); color:#fff; border-radius:10px; pointer-events:none;
}
.banner h3{font-size:2.6rem; color:#FFD23F; -webkit-text-stroke:6px var(--line); paint-order:stroke fill}
.banner p{margin:0; font-size:1.15rem}
.panel{margin-top:10px; display:grid; gap:8px}
.mana{position:relative; height:24px; border:3px solid var(--line); border-radius:12px; background:var(--panel); overflow:hidden}
.mana i{display:block; height:100%; width:0; background:linear-gradient(180deg,#C79BFF,#7B4FD6)}
.mana span{position:absolute; inset:0; display:grid; place-items:center; font-weight:800; font-size:.85rem; color:#fff; text-shadow:0 1px 0 #000}
.hand{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.hc{
  position:relative; display:grid; justify-items:center; gap:0; padding:4px 2px 3px; font:inherit; color:var(--ink); cursor:pointer;
  background:var(--panel2); border:3px solid var(--line); border-radius:12px; box-shadow:0 4px 0 var(--shadow); overflow:hidden;
}
.hc .art{width:100%; aspect-ratio:1; border-radius:8px; background:radial-gradient(circle at 50% 40%,#fff6,transparent 70%),var(--cc); display:grid; place-items:center}
.hc .art img{width:92%; height:92%}
.hc .n{font-size:.6rem; font-weight:800; line-height:1.05; text-align:center; margin-top:2px; min-height:1.3em; overflow-wrap:anywhere}
.hc .c{position:absolute; top:-1px; left:-1px; width:24px; height:24px; border-radius:0 0 12px 0; background:linear-gradient(180deg,#B58CFF,#6A3DE0); color:#fff; font-family:'Lilita One',system-ui,sans-serif; font-size:1rem; display:grid; place-items:center; border-right:3px solid var(--line); border-bottom:3px solid var(--line)}
.hc.sel{outline:4px solid var(--gold); transform:translateY(-6px)}
.hc.dim{opacity:.55}
.hc.block{filter:grayscale(.85)}
.next{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:.9rem; color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.6)}
.next .nx{display:flex; align-items:center; gap:6px}
.next .nx img{width:32px; height:32px; background:var(--panel); border:3px solid var(--line); border-radius:8px}
.hintline{margin:0; font-size:.9rem; color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.6); min-height:1.3em}
.pieces{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  display:flex; align-items:center; gap:6px; padding:3px 12px 3px 4px; font:inherit; font-weight:800; color:var(--ink); cursor:pointer;
  background:var(--panel2); border:3px solid var(--line); border-radius:14px; box-shadow:0 3px 0 var(--shadow);
}
.chip img{width:36px; height:36px}
.chip.sel{background:linear-gradient(180deg,#FFE066,var(--gold)); color:#2A1A3D}
.chip.placed{opacity:.65}
.pt{font-family:'Lilita One',system-ui,sans-serif; font-size:1.2rem; color:#fff; -webkit-text-stroke:4px var(--line); paint-order:stroke fill}

/* modal e aviso */
.modal{position:fixed; inset:0; background:rgba(20,10,40,.65); display:grid; place-items:center; padding:16px; z-index:20}
.sheet{background:var(--panel); color:var(--ink); border:3px solid var(--line); border-radius:20px; padding:18px; width:min(100%,390px); box-shadow:0 7px 0 var(--shadow); max-height:88vh; overflow:auto}
.sheet h3{font-size:1.9rem; margin-bottom:4px}
.sheet p{margin:6px 0}
.sheet ul{margin:8px 0; padding-left:18px; font-weight:700}
.sheet .row{margin-top:14px; justify-content:flex-end}
.sheet .portrait{float:right; width:84px; height:84px; margin:0 0 6px 10px}
.toast{
  position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:var(--ink); color:var(--panel); padding:8px 14px; border-radius:12px; font-weight:800; z-index:30; max-width:88vw; text-align:center; border:3px solid var(--line);
}

/* ===== retrato ===== */
.fsb{margin-bottom:6px}
.bmcols{display:grid; gap:10px}
.bmcols h3{color:#fff; -webkit-text-stroke:4px var(--line); paint-order:stroke fill; font-size:1.25rem}
.seg{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0}
#v-game{position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; gap:4px; padding:calc(4px + env(safe-area-inset-top,0px)) calc(6px + env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) calc(6px + env(safe-area-inset-left,0px)); background:linear-gradient(180deg,var(--sky1),var(--sky2))}
#side1{order:1} .mid{order:2; flex:1; min-height:0; min-width:0; display:flex; flex-direction:column; gap:4px} #side0{order:3}
.hud{display:grid; grid-template-columns:auto 1fr auto 1fr auto; gap:6px; align-items:center; margin:0}
.hud .clock{font-size:1.35rem; min-width:56px}
.hud .hb{font-size:.78rem}
.arena{flex:1; min-height:0; width:auto; max-width:none; margin:0; display:grid; place-items:center; position:relative}
canvas#cv{border-width:3px; border-radius:10px}
.banner{inset:0}
.pbar{position:absolute; top:8px; left:50%; transform:translateX(-50%); padding:4px 14px; border-radius:12px; background:var(--panel); border:3px solid var(--line); font-weight:800; pointer-events:none; white-space:nowrap}
.side{display:flex; flex-direction:column; gap:4px; flex:none}
.hrow{display:grid; grid-template-columns:repeat(5,1fr); gap:5px}
.side .hc .n{font-size:.58rem}
.side .hc .art img{width:90%; height:90%}
.bot{display:flex; align-items:center; gap:6px}
.bot .mana{flex:1; height:22px}
.bot .btn{min-height:30px; padding:2px 8px; font-size:.78rem}
.side .pt{font-size:1rem; text-align:center}
.side .pieces{justify-content:center}
.side .chip{padding:2px 8px 2px 3px; font-size:.8rem}
.side .chip img{width:30px; height:30px}
.nx2{display:flex; align-items:center; gap:3px; font-size:.62rem; color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.6)}
.nx2 img{width:24px; height:24px; background:var(--panel); border:2px solid var(--line); border-radius:6px}
.onl{display:grid; gap:8px}
.onl>.btn{width:100%}
.code{font-family:'Lilita One','Arial Black',system-ui,sans-serif; font-size:2.6rem; letter-spacing:.2em; text-align:center; color:#FFD23F; -webkit-text-stroke:6px var(--line); paint-order:stroke fill; padding:4px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<div class="app">

  <section id="v-home">
    <button class="btn small fsb" id="fs-home" type="button">⛶ Tela cheia</button>
    <div class="logo">
      <h1>Valdoria</h1>
      <div class="ribbon">Guerra de Cartas</div>
    </div>
    <div class="heroWrap"><canvas id="hero" width="780" height="330" aria-hidden="true"></canvas></div>
    <div class="menu">
      <button class="big hot" id="go-battle" type="button"><img id="img-battle" alt="" width="64" height="64"><span>Batalha<small id="home-main">Máquina ou online</small></span></button>
      <button class="big cool" id="go-editor" type="button"><img id="img-editor" alt="" width="64" height="64"><span>Meus decks<small>Monte até 5 baralhos</small></span></button>
    </div>
    <div class="deckstrip"><b id="home-deckname">Deck principal</b><div class="faces" id="home-faces"></div></div>
    <p class="note" id="save-note"></p>
  </section>

  <section id="v-editor" hidden>
    <div class="topbar"><button class="btn small" id="ed-back" type="button">‹ Início</button><h2>Meus decks</h2></div>
    <div class="edwrap"><div class="edL">
    <div class="slots" id="slots" role="group" aria-label="Vagas de deck"></div>
    <div class="row" style="margin-top:10px">
      <input class="txt" id="dname" maxlength="16" aria-label="Nome do deck" style="flex:1 1 140px;width:auto">
      <button class="btn small go" id="setmain" type="button">★ Principal</button>
    </div>
    <div class="stats" id="stats"></div>
    <ul class="msgs" id="msgs"></ul>
    <div class="row">
      <button class="btn small cool" id="rand" type="button">🎲 Montar aleatório</button>
      <button class="btn small" id="clear" type="button">Limpar</button>
    </div>
    <p class="note" id="ed-note" style="text-align:left"></p>
    </div><div class="edR"><div id="pool"></div></div></div>
  </section>

  <section id="v-bmenu" hidden>
    <div class="topbar"><button class="btn small" id="bm-back" type="button">‹ Início</button><h2>Batalha</h2><button class="btn small" id="bm-edit" type="button">Editar decks</button><button class="btn hot" id="bm-start" type="button">⚔️ Iniciar</button></div>
    <div id="bm-body"></div>
    <p class="note" id="bm-note"></p>
  </section>

  <section id="v-game" hidden>
    <aside class="side" id="side0"></aside>
    <div class="mid">
      <div class="hud">
        <button class="btn small" id="g-quit" type="button">✕</button>
        <div class="hb"><span id="n0">Você</span><div class="bar"><i id="hp-me"></i></div></div>
        <div class="clock" id="clock">3:00</div>
        <div class="hb foe"><span id="n1">Rival</span><div class="bar"><i id="hp-foe"></i></div></div>
        <button class="btn small fsb" id="g-fs" type="button" style="margin:0" aria-label="Tela cheia">⛶</button>
      </div>
      <div class="arena" id="arena">
        <canvas id="cv" aria-label="Campo de batalha"></canvas>
        <div class="pbar" id="pbar" hidden></div>
        <div class="banner" id="banner" hidden><h3></h3><p></p></div>
      </div>
    </div>
    <aside class="side r" id="side1" hidden></aside>
  </section>

</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>if(typeof Peer==='undefined'){ document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>'); }</script>
<script id="logic">
const CM = (function(){
'use strict';
const W=14, H=18, HALF=9, MATCH=180, MAXMANA=10, REGEN=2.2, AGGRO=6.5, PLACE_TIME=25, SPD=.75;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

/* ---------- decks ---------- */
function validateDeck(ids){
  const errs=[], warns=[];
  let tr=0, sp=0, st=0, sum=0;
  ids.forEach(k=>{ const c=CARDS[k]; if(!c) return; if(c.tipo==='tropa'){tr++;sum+=c.custo;} else if(c.tipo==='feitico'){sp++;sum+=c.custo;} else st++; });
  const n=ids.length, play=tr+sp;
  if(n<8) errs.push('Faltam '+(8-n)+' carta(s): o deck precisa de 8 a 12.');
  if(n>12) errs.push('Sobram '+(n-12)+' carta(s): o máximo é 12.');
  if(play<6) errs.push('Mínimo de 6 cartas jogáveis (tropas + feitiços).');
  if(st>4) errs.push('Máximo de 4 construções/armadilhas.');
  if(!ids.some(k=>{ const c=CARDS[k]; return c&&((c.u&&(c.u.proj||c.u.fly))||(c.s&&c.s.proj&&!c.s.ground)||(c.z&&c.z.ground)); })) warns.push('Seu deck não tem como atacar voadores (use arqueira, mago, balista, rede...).');
  ids.forEach(k=>{
    const c=CARDS[k]; if(!c||c.tipo!=='feitico'||!c.req) return;
    if(!c.req.some(r=>ids.indexOf(r)>=0)) warns.push(c.nome+' precisa de: '+c.reqTxt+'. Sem isso, a carta fica bloqueada.');
  });
  return {ok:errs.length===0, errs, warns, n, play, st, avg: play?sum/play:0};
}
const DEFAULT_DECK=['cavaleiro','arqueira','mago','clerigo','ladino','engenheiro','bola_fogo','bencao','canhao','muralha','espinhos','altar'];
function randomDeck(rng){
  rng=rng||Math.random;
  const builds=ORDER.constr.concat(ORDER.armad);
  for(let tries=0;tries<300;tries++){
    const n=8+Math.floor(rng()*5);
    const maxSt=Math.min(4,n-6);
    const ns=Math.floor(rng()*(maxSt+1));
    const play=n-ns;
    const nsp=Math.min(Math.floor(rng()*4), play-3);
    const ids=shuffle(builds.slice(),rng).slice(0,ns)
      .concat(shuffle(ORDER.tropa.slice(),rng).slice(0,play-nsp))
      .concat(shuffle(ORDER.feitico.slice(),rng).slice(0,nsp));
    const v=validateDeck(ids);
    if(v.ok && v.warns.length===0) return ids;
  }
  return DEFAULT_DECK.slice();
}

/* ---------- mapas procedurais ---------- */
const MAPS=[
  {id:'floresta',nome:'Floresta Sussurrante',slow:'Lama'},
  {id:'ruinas',nome:'Ruínas Antigas',slow:'Entulho'},
  {id:'deserto',nome:'Deserto Escaldante',slow:'Areia fofa'},
  {id:'montanha',nome:'Pico Nevado',slow:'Neve funda'},
  {id:'lava',nome:'Vale de Lava',slow:'Cinzas'},
  {id:'ceu',nome:'Palácio do Céu',slow:'Nuvens'}
];
function newGrid(v){ const g=[]; for(let r=0;r<H;r++) g.push(new Array(W).fill(v)); return g; }
function connected(tiles){
  const gx=W>>1, gy=H-4, seen=new Uint8Array(W*H), q=[3*W+(W>>1)];
  seen[q[0]]=1;
  while(q.length){
    const cur=q.pop(), c=cur%W, r=(cur/W)|0;
    if(c===gx&&r===gy) return true;
    const ds=[[1,0],[-1,0],[0,1],[0,-1]];
    for(let i=0;i<4;i++){
      const nc=c+ds[i][0], nr=r+ds[i][1];
      if(nc<0||nr<0||nc>=W||nr>=H) continue;
      const ni=nr*W+nc;
      if(seen[ni]||tiles[nr][nc]==='#') continue;
      seen[ni]=1; q.push(ni);
    }
  }
  return false;
}
function genMap(rng){
  const tiles=[], road=newGrid(false);
  for(let r=0;r<H;r++) tiles.push(new Array(W).fill('#'));
  const rr=(a,b)=>a+rng()*(b-a);
  const ys=[3.5,6.5,9,11.5,H-3.5];
  const rot=pts=>pts.map(p=>({x:W-p.x,y:H-p.y}));
  const drift=x0=>{ const xs=[x0]; for(let k=1;k<5;k++) xs.push(clamp(xs[k-1]+rr(-3,3),1.8,W-1.8)); return xs.map((x,k)=>({x:x,y:ys[k]})); };
  const nR=rng()<.5?3:4, routes=[];
  if(nR===4){
    const a=drift(rr(2.2,4.4)), b=drift(rr(5.2,6.4));
    routes.push(a,rot(a),b,rot(b));
  } else {
    const a=drift(rr(2.2,4.6)); routes.push(a,rot(a));
    const a0=rr(5.8,8.2), a1=clamp(a0+rr(-3,3),3,W-3);
    routes.push([{x:a0,y:3.5},{x:a1,y:6.5},{x:W/2,y:H/2},{x:W-a1,y:H-6.5},{x:W-a0,y:H-3.5}]);
  }
  const cnt=new Uint8Array(W*H);
  routes.forEach(pts=>{
    const seen=new Uint8Array(W*H);
    for(let k=0;k+1<pts.length;k++){
      const a=pts[k], b=pts[k+1], L=Math.hypot(b.x-a.x,b.y-a.y), n=Math.max(1,Math.ceil(L/.2));
      for(let i=0;i<=n;i++){
        const sx=a.x+(b.x-a.x)*i/n, sy=a.y+(b.y-a.y)*i/n;
        for(let r=Math.floor(sy-1.2);r<=Math.floor(sy+1.2);r++) for(let c=Math.floor(sx-1.2);c<=Math.floor(sx+1.2);c++){
          if(c<0||r<0||c>=W||r>=H) continue;
          if(Math.hypot(c+.5-sx,r+.5-sy)<1.0){ road[r][c]=true; if(!seen[r*W+c]){ seen[r*W+c]=1; cnt[r*W+c]++; } }
        }
      }
    }
  });
  for(let r=0;r<H;r++) for(let c=0;c<W;c++){
    if((r<=3||r>=H-4)&&c>=2&&c<=W-3) road[r][c]=true;
    if(road[r][c]) tiles[r][c]='.';
  }
  // cruzamentos e zona de cruzamento
  const juncZone=newGrid(false);
  for(let r=4;r<H-4;r++) for(let c=0;c<W;c++){
    if(cnt[r*W+c]>=2){
      for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
        const nr=r+dr, nc=c+dc; if(nr>=0&&nc>=0&&nr<H&&nc<W) juncZone[nr][nc]=true;
      }
    }
  }
  // obstáculos nas trilhas (simétricos)
  const obst=[];
  const cand=[];
  for(let r=4;r<=HALF-1;r++) for(let c=0;c<W;c++) if(tiles[r][c]==='.'&&road[r][c]&&!juncZone[r][c]) cand.push([c,r]);
  shuffle(cand,rng);
  const wantO=2+Math.floor(rng()*2);
  for(let i=0;i<cand.length&&obst.length<wantO;i++){
    const c=cand[i][0], r=cand[i][1], m=[W-1-c,H-1-r];
    if(obst.some(o=>Math.max(Math.abs(o[0]-c),Math.abs(o[1]-r))<3)) continue;
    tiles[r][c]='#'; tiles[m[1]][m[0]]='#';
    if(connected(tiles)) obst.push([c,r]); else { tiles[r][c]='.'; tiles[m[1]][m[0]]='.'; }
  }
  // trechos lentos (simétricos)
  const slow=[];
  shuffle(cand,rng);
  for(let i=0;i<cand.length&&slow.length<3;i++){
    const c=cand[i][0], r=cand[i][1];
    if(tiles[r][c]!=='.') continue;
    const nb=[[1,0],[0,1],[-1,0],[0,-1]].map(d=>[c+d[0],r+d[1]]).filter(p=>p[0]>=0&&p[1]>=4&&p[0]<W&&p[1]<=HALF-1&&tiles[p[1]][p[0]]==='.'&&!juncZone[p[1]][p[0]]);
    const set=[[c,r]]; if(nb.length) set.push(nb[Math.floor(rng()*nb.length)]);
    set.forEach(p=>{ tiles[p[1]][p[0]]='~'; tiles[H-1-p[1]][W-1-p[0]]='~'; });
    slow.push(set);
  }
  // locais de construção (pads), só na metade de baixo; a de cima é o espelho
  const roadC=[], sideC=[];
  for(let r=HALF+1;r<=H-3;r++) for(let c=0;c<W;c++){
    if(juncZone[r][c]) continue;
    if(tiles[r][c]==='.'&&road[r][c]) roadC.push([c,r]);
    else if(tiles[r][c]==='#'){
      const ds=[[1,0],[-1,0],[0,1],[0,-1]];
      if(ds.some(d=>{ const nc=c+d[0], nr=r+d[1]; return nc>=0&&nr>=0&&nc<W&&nr<H&&tiles[nr][nc]==='.'&&road[nr][nc]; })) sideC.push([c,r]);
    }
  }
  const padsP=[];
  const take=(arr,n,kind)=>{
    shuffle(arr,rng); let k=0;
    for(let i=0;i<arr.length&&k<n;i++){
      const c=arr[i][0], r=arr[i][1];
      if(padsP.some(p=>Math.max(Math.abs(p.c-c),Math.abs(p.r-r))<2)) continue;
      padsP.push({c:c,r:r,kind:kind}); k++;
    }
  };
  take(roadC,5,'road'); take(sideC,5,'side');
  const padsA=padsP.map(p=>({c:W-1-p.c,r:H-1-p.r,kind:p.kind}));
  padsP.concat(padsA).forEach(p=>{ tiles[p.r][p.c]='p'; });
  return {tiles:tiles,road:road,pads:[padsP,padsA],nRoutes:nR};
}

/* ---------- jogo ---------- */
function createGame(o){
  const rng=o.rng||Math.random;
  const mi=o.mapIndex!=null?o.mapIndex:Math.floor(rng()*MAPS.length);
  const mapDef=MAPS[mi];
  let map=null;
  for(let i=0;i<40&&!map;i++){ const m=genMap(rng); if(connected(m.tiles)&&m.pads[0].length>=6) map=m; }
  if(!map) map=genMap(rng);
  const G={t:0,over:false,winner:-1,phase:'place',placeT:PLACE_TIME,mapDef,map,tiles:map.tiles,pads:map.pads,decor:Math.floor(rng()*1e9),

    if(r==='nopath'){ const alt=nearestStructure(G,u); if(alt&&alt!==t){ u.tgt=alt; u.tgtId=alt.id; u.retT=1; u.path=null; u.noPath=false; } }
  }
}
function updateStruct(G,s,dt){
  if(s.type==='trap') return;
  const d=s.def;
  if(s.cd>0) s.cd-=dt; if(s.hit>0) s.hit-=dt; if(s.atk>0) s.atk-=dt;
  if(s.st.silence>0) s.st.silence-=dt;
  if(d.heal){
    s.t+=dt;
    if(s.t>=1&&canAct(s)){
      s.t=0;
      G.ents.forEach(a=>{ if(!a.dead&&a.team===s.team&&a!==s&&a.type!=='trap'&&a.hp<a.maxhp&&Math.hypot(a.x-s.x,a.y-s.y)<=d.heal.r) a.hp=Math.min(a.maxhp,a.hp+d.heal.v); });
      fx(G,{k:'ring',x:s.x,y:s.y,r:d.heal.r,dur:.5,c:'rgba(124,255,176,.7)'});
    }
  }
  if(d.spawn){
    s.t+=dt;
    if(s.t>=d.spawn.every){
      s.t=0;
      const n=G.ents.filter(e=>!e.dead&&e.owner===s.id).length;
      if(n<3){
        const dy=s.team===0?-1:1;
        const spots=[[0,dy],[1,dy],[-1,dy],[1,0],[-1,0],[0,-dy]];
        for(let i=0;i<spots.length;i++){
          const c=s.tx+spots[i][0], r=s.ty+spots[i][1];
          if(!blockedTile(G,c,r)){ const so=mkUnit(G,s.team,'soldado',c+.5,r+.5); so.owner=s.id; break; }
        }
      }
    }
  }
  if(d.dm>0&&canAct(s)&&s.cd<=0){
    let t=null,bd=1e9;
    G.ents.forEach(e=>{ if(e.kind==='unit'&&!e.dead&&e.team!==s.team){ const g=Math.hypot(e.x-s.x,e.y-s.y)-e.r; if(g<=d.rg&&g<bd&&!(d.ground&&air(e))&&(d.ty==='magic'||air(e)||losClear(G,s.x,s.y,e.x,e.y))){bd=g;t=e;} } });
    if(t){ s.cd=d.iv; fire(G,s,t); }
  }
}
function updateProj(G,dt){
  for(let i=G.proj.length-1;i>=0;i--){
    const p=G.proj[i], t=G.byId.get(p.tid);
    if(!t||t.dead){ G.proj.splice(i,1); continue; }
    const dx=t.x-p.x, dy=t.y-p.y, d=Math.hypot(dx,dy), m=p.sp*dt;
    (p.tr=p.tr||[]).push([p.x,p.y]); if(p.tr.length>7) p.tr.shift();
    if(d<=m+.15){
      if(p.aoe>0){ areaDamage(G,p.team,t.x,t.y,p.aoe,p.dm,p.ty); fx(G,{k:'ring',x:t.x,y:t.y,r:p.aoe,dur:.3,c:p.fire?'#FF8A3D':'#C58BFF'}); fx(G,{k:'burst',x:t.x,y:t.y,r:p.aoe,dur:.5,c:p.fire?'#FFB02E':'#C58BFF',n:10}); }
      else damage(G,t,p.dm,p.ty);
      if(p.root&&!t.dead) t.st.root=Math.max(t.st.root,p.root);
      G.proj.splice(i,1);
    } else { p.x+=dx/d*m; p.y+=dy/d*m; }
  }
}
function updateTraps(G,units){
  G.ents.slice().forEach(t=>{
    if(t.type!=='trap'||t.dead) return;
    const tr=t.def.trap;
    if(!units.some(u=>!u.dead&&u.team!==t.team&&Math.hypot(u.x-t.x,u.y-t.y)<.7)) return;
    units.forEach(u=>{
      if(u.dead||u.team===t.team||Math.hypot(u.x-t.x,u.y-t.y)-u.r*.5>tr.r) return;
      damage(G,u,tr.dm,tr.ty);
      if(tr.slow){ u.st.slow=tr.slowT; u.st.slowM=tr.slow; }
      if(tr.freeze) u.st.freeze=tr.freeze;
    });
    t.dead=true; fx(G,{k:'ring',x:t.x,y:t.y,r:tr.r,dur:.45,c:t.def.trap.freeze?'#9FE3FF':'#FF8A4D'});
  });
}
function separate(G,units){
  const nudge=(u,dx,dy)=>{ const nx=u.x+dx, ny=u.y+dy; if(air(u)||!blockedTile(G,Math.floor(nx),Math.floor(ny))){ u.x=nx; u.y=ny; } };
  for(let i=0;i<units.length;i++){
    const a=units[i]; if(a.dead) continue;
    for(let j=i+1;j<units.length;j++){
      const b=units[j]; if(b.dead||air(a)!==air(b)) continue;
      let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy); const m=(a.r+b.r)*.85;
      if(d>=m) continue;
      if(d<.001){ dx=Math.random()-.5; dy=Math.random()-.5; d=Math.hypot(dx,dy)||1; }
      const push=(m-d)*.25, nx=dx/d, ny=dy/d;
      const fa=a.st.freeze>0, fb=b.st.freeze>0;
      if(!fa) nudge(a,-nx*push*(fb?2:1),-ny*push*(fb?2:1));
      if(!fb) nudge(b,nx*push*(fa?2:1),ny*push*(fa?2:1));
    }
  }
}
function endByTime(G){
  const a=G.hearts[0].hp/G.hearts[0].maxhp, b=G.hearts[1].hp/G.hearts[1].maxhp;
  G.over=true; G.winner=a>b+.0001?0:b>a+.0001?1:2;
}
function step(G,dt){
  if(G.over||G.phase!=='battle') return;
  G.t+=dt;
  while(G.iceExp.length&&G.iceExp[0]<=G.t){ G.iceExp.shift(); G.ver++; }
  G.side.forEach((S,i)=>{ S.mana=Math.min(MAXMANA,S.mana+dt/REGEN*(i===1?G.dp[1].reg:1)); });
  if(!G.pvp) aiThink(G,1,dt); if(G.auto0) aiThink(G,0,dt);
  for(let i=G.delayed.length-1;i>=0;i--){ const d=G.delayed[i]; d.t-=dt; if(d.t<=0){ G.delayed.splice(i,1); d.fn(); } }
  const list=G.ents.slice();
  const units=list.filter(e=>e.kind==='unit'&&!e.dead);
  units.forEach(u=>{ u.haste=1; });
  units.forEach(b=>{ if(b.def.aura&&canAct(b)) units.forEach(a=>{ if(a.team===b.team&&Math.hypot(a.x-b.x,a.y-b.y)<=b.def.aura) a.haste=Math.min(a.haste,.75); }); });
  list.forEach(e=>{ if(!e.dead&&e.kind==='struct') updateStruct(G,e,dt); });
  units.forEach(u=>{ if(!u.dead) updateUnit(G,u,dt); });
  separate(G,G.ents.filter(e=>e.kind==='unit'&&!e.dead));
  updateTraps(G,G.ents.filter(e=>e.kind==='unit'&&!e.dead));
  updateProj(G,dt);
  for(let i=G.fx.length-1;i>=0;i--){ G.fx[i].t+=dt; if(G.fx[i].t>=G.fx[i].dur) G.fx.splice(i,1); }
  G.ents=G.ents.filter(e=>{ if(e.dead&&e.type!=='heart'){ G.byId.delete(e.id); return false; } return true; });
  if(!G.over&&G.t>=MATCH) endByTime(G);
}

/* cartas em jogo */
function spellReason(G,side,k){
  const c=CARDS[k];
  if(!c||c.tipo!=='feitico'||!c.req) return '';
  const ok=G.ents.some(e=>!e.dead&&e.team===side&&c.req.indexOf(e.key)>=0);
  return ok?'':'Precisa de: '+c.reqTxt;
}
function cycle(S,hi){ const k=S.hand[hi]; S.hand[hi]=S.queue.shift(); S.queue.push(k); }
function nearestOwn(G,side,keys,x,y){
  let b=null,bd=1e9;
  G.ents.forEach(e=>{ if(!e.dead&&e.team===side&&keys.indexOf(e.key)>=0){ const d=Math.hypot(e.x-x,e.y-y); if(d<bd){bd=d;b=e;} } });
  return b;
}
function castSpell(G,side,k,x,y){
  x=clamp(x,0,W); y=clamp(y,0,H);
  const c=CARDS[k];
  if(c.z){
    const z=c.z, sd={tempestade:1.6,rede:1.2,runa:1,selo_gelo:1,espinhos:1};
    fx(G,{k:'spell',sp:k,x:x,y:y,r:z.r,dur:sd[k]||1,c:z.c});
    G.delayed.push({t:.35,fn:()=>{
      fx(G,{k:'spellhit',sp:k,x:x,y:y,r:z.r,dur:.8,c:z.c}); shake(G,k==='runa'||k==='tempestade'?.5:.22);
      G.ents.forEach(e=>{
        if(e.dead||e.team===side||e.kind!=='unit'||Math.hypot(e.x-x,e.y-y)-e.r*.5>z.r) return;
        const a=air(e);
        if((z.airOnly&&!a)||(z.gnd&&a)) return;
        damage(G,e,(z.gdm!=null&&!a)?z.gdm:z.dm,z.ty);
        if(a&&z.ground) e.grounded=z.ground;
        if(z.slow&&!a){ e.st.slow=z.slowT; e.st.slowM=z.slow; }
        if(z.freeze) e.st.freeze=z.freeze;
      });
    }});
    return;
  }
  if(k==='bola_fogo'){
    const src=nearestOwn(G,side,c.req,x,y);
    fx(G,{k:'fireball',x:src.x,y:src.y,x2:x,y2:y,dur:.55});
    G.delayed.push({t:.55,fn:()=>{ areaDamage(G,side,x,y,1.6,190,'magic'); fx(G,{k:'boom',x:x,y:y,r:1.9,dur:1}); shake(G,.65); }});
  } else if(k==='raio_arcano'){
    const src=nearestOwn(G,side,c.req,x,y);
    const tg=G.ents.filter(e=>!e.dead&&e.team!==side&&e.type!=='trap'&&Math.hypot(e.x-x,e.y-y)-e.r<=2.5)
      .sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y)).slice(0,3);
    tg.forEach((e,i)=>{ damage(G,e,120,'magic'); fx(G,{k:'bolt',x:src.x,y:src.y,x2:e.x,y2:e.y,dur:.45,c:'#FFE66B',seed:i+1}); fx(G,{k:'zap',x:e.x,y:e.y,dur:.45,c:'#FFF6A8'}); });
    if(!tg.length) fx(G,{k:'bolt',x:src.x,y:src.y,x2:x,y2:y,dur:.45,c:'#FFE66B',seed:1});
    fx(G,{k:'ring',x:x,y:y,r:2.5,dur:.35,c:'#FFE66B'}); shake(G,.2);
  } else if(k==='bencao'){
    G.ents.forEach(e=>{ if(!e.dead&&e.team===side&&e.type!=='trap'&&Math.hypot(e.x-x,e.y-y)-e.r<=2.6) e.hp=Math.min(e.maxhp,e.hp+160); });
    fx(G,{k:'heal',x:x,y:y,r:2.6,dur:1.2});
  } else if(k==='muralha_gelo'){
    const cy=clamp(Math.floor(y),0,H-1), cx=Math.floor(x);
    for(let dx=-1;dx<=1;dx++){
      const cc=cx+dx;
      if(cc<0||cc>=W||G.tiles[cy][cc]==='#'||G.occ[cy][cc]) continue;
      G.ice[cy][cc]=G.t+7;
    }
    G.iceExp.push(G.t+7); G.ver++;
    fx(G,{k:'icewall',x:cx+.5,y:cy+.5,r:1.8,dur:.9}); shake(G,.15);
  } else if(k==='silencio'){
    G.ents.forEach(e=>{ if(!e.dead&&e.team!==side&&e.type!=='trap'&&e.def.magicUser&&Math.hypot(e.x-x,e.y-y)-e.r<=2.6) e.st.silence=5; });
    fx(G,{k:'silence',x:x,y:y,r:2.6,dur:1.2});
  }
}
function playCheck(G,side,hi,x,y){
  if(G.phase!=='battle'||G.over) return {ok:false,msg:''};
  const S=G.side[side], k=S.hand[hi], c=CARDS[k];
  if(!c||!(x>=0&&x<=W&&y>=0&&y<=H)) return {ok:false,msg:''};
  if(S.mana<c.custo) return {ok:false,msg:'Mana insuficiente'};
  if(c.tipo==='tropa'){
    const okZone=side===0?(y>=HALF&&y<H):(y>=0&&y<HALF);
    if(!okZone||x<0||x>=W) return {ok:false,msg:'Invoque na sua metade do campo'};
    if(c.u.fly?G.occ[Math.floor(y)][Math.floor(x)]:blockedTile(G,Math.floor(x),Math.floor(y))) return {ok:false,msg:'Invoque sobre um ponto livre'};
  } else {
    const why=spellReason(G,side,k);
    if(why) return {ok:false,msg:why};
  }
  return {ok:true,msg:''};
}
function playCard(G,side,hi,x,y){
  const chk=playCheck(G,side,hi,x,y); if(!chk.ok) return chk;
  const S=G.side[side], k=S.hand[hi], c=CARDS[k];
  if(c.tipo==='tropa'){
    for(let i=0;i<(c.sw||1);i++) mkUnit(G,side,k,x+(i-((c.sw||1)-1)/2)*.45,y);
    fx(G,{k:'ring',x:x,y:y,r:.7,dur:.3,c:'#FFF8E6'}); fx(G,{k:'spawn',x:x,y:y,dur:.5,team:side});
  } else castSpell(G,side,k,x,y);
  S.mana-=c.custo; cycle(S,hi);
  return {ok:true,msg:''};
}
function discard(G,side,hi){
  const S=G.side[side];
  if(G.phase!=='battle'||G.over||S.mana<1) return false;
  S.mana-=1; cycle(S,hi); return true;
}

/* ---------- IA ---------- */
function walkableList(G,side,r0,r1){
  const o=[];
  for(let r=r0;r<=r1;r++) for(let c=0;c<W;c++) if(!blockedTile(G,c,r)) o.push({x:c+.5,y:r+.5});
  return o;
}
function nearestWalkable(G,side,x,y){
  const l=side===1?walkableList(G,side,2,HALF-1):walkableList(G,side,HALF,H-3);
  let b=null,bd=1e9;
  l.forEach(p=>{ const d=Math.hypot(p.x-x,p.y-y); if(d<bd){bd=d;b=p;} });
  return b;
}
function aiSpellTarget(G,side,k,enemies,eu,threats){
  const S=G.side[side], me=G.hearts[side];
  if(k==='bola_fogo'){
    let best=null,bs=0;
    enemies.forEach(e=>{ let sc=0; enemies.forEach(o=>{ if(Math.hypot(o.x-e.x,o.y-e.y)<=1.6) sc+=o.kind==='unit'?1:.6; }); if(sc>bs){bs=sc;best=e;} });
    return bs>=2?{x:best.x,y:best.y}:null;
  }
  if(k==='raio_arcano'){
    let best=null,bs=0;
    eu.forEach(e=>{ let sc=0; eu.forEach(o=>{ if(Math.hypot(o.x-e.x,o.y-e.y)<=2.5) sc++; }); if(sc>bs){bs=sc;best=e;} });
    return bs>=2?{x:best.x,y:best.y}:null;
  }
  if(k==='bencao'){
    const hurt=G.ents.filter(e=>!e.dead&&e.team===side&&e.type!=='trap'&&e.hp<e.maxhp*.7);
    let best=null,bs=0;
    hurt.forEach(e=>{ let sc=0; hurt.forEach(o=>{ if(Math.hypot(o.x-e.x,o.y-e.y)<=2.6) sc++; }); if(sc>bs){bs=sc;best=e;} });
    return bs>=2?{x:best.x,y:best.y}:null;
  }
  if(k==='muralha_gelo'){
    if(G.t-S.lastIce<12) return null;
    const t=threats.filter(u=>u.def.rg<2).sort((a,b)=>dist(a,me)-dist(b,me))[0];
    if(!t) return null;
    S.lastIce=G.t;
    return {x:t.x+(me.x-t.x)*.5,y:t.y+(me.y-t.y)*.5};
  }
  if(k==='silencio'){
    const mu=eu.filter(e=>e.def.magicUser);
    let best=null,bs=0;
    mu.forEach(e=>{ let sc=0; mu.forEach(o=>{ if(Math.hypot(o.x-e.x,o.y-e.y)<=2.6) sc++; }); if(sc>bs){bs=sc;best=e;} });
    return bs>=2?{x:best.x,y:best.y}:null;
  }
  return null;
}
function aiThink(G,side,dt){
  const S=G.side[side];
  S.aiT-=dt; if(S.aiT>0) return;
  const P=G.dp[side]; S.aiT=P.iv[0]+G.rng()*(P.iv[1]-P.iv[0]);
  const me=G.hearts[side], foe=1-side;
  const enemies=G.ents.filter(e=>!e.dead&&e.team===foe&&e.type!=='trap');
  const eu=enemies.filter(e=>e.kind==='unit');
  const threats=eu.filter(e=>dist(e,me)<10);
  const hand=S.hand.map((k,i)=>({k:k,i:i,d:CARDS[k]})).filter(h=>h.d.custo<=S.mana);
  const spells=shuffle(hand.filter(h=>h.d.tipo==='feitico'),G.rng);
  for(let n=0;n<spells.length;n++){
    const h=spells[n];
    if(spellReason(G,side,h.k)) continue;
    const tg=aiSpellTarget(G,side,h.k,enemies,eu,threats);
    if(tg&&G.rng()<G.dp[side].sp){ playCard(G,side,h.i,tg.x,tg.y); return; }
  }
  const damaged=G.ents.some(e=>!e.dead&&e.team===side&&e.type==='building'&&e.hp<e.maxhp*.8);
  const troops=hand.filter(h=>h.d.tipo==='tropa'&&(h.k!=='engenheiro'||damaged||S.mana>=9));
  if(!troops.length){
    const stuck=S.hand.findIndex(k=>CARDS[k].tipo==='feitico'&&spellReason(G,side,k));
    if(stuck>=0&&S.mana>=1&&G.rng()<.3) discard(G,side,stuck);
    return;
  }
  const want=threats.length>0||S.mana>=7||G.rng()<.35;
  if(!want) return;
  let pick;
  if(threats.length){
    const rush=threats.some(t=>t.def.tg==='tower'||t.def.tg==='struct');
    const air=threats.some(t=>t.def.fly);
    const pref=troops.filter(h=>air&&G.dp[side].cnt?(h.d.u.proj||h.d.u.fly):rush?['cavaleiro','berserker','ladino'].indexOf(h.k)>=0:true);
    const pool=pref.length?pref:troops;
    pick=pool[Math.floor(G.rng()*pool.length)];
  } else pick=troops[Math.floor(G.rng()*troops.length)];
  let spot;
  if(threats.length){
    const t=threats.slice().sort((a,b)=>dist(a,me)-dist(b,me))[0];
    spot=nearestWalkable(G,side,t.x+(G.rng()*2-1),side===1?5:H-6);
  } else {
    const l=side===1?walkableList(G,side,4,HALF-1):walkableList(G,side,HALF,H-5);
    spot=l.length?l[Math.floor(G.rng()*l.length)]:null;
  }
  if(spot) playCard(G,side,pick.i,spot.x,spot.y);
}

/* ---------- multiplayer: instantâneos do servidor e visão do cliente ---------- */
const r2=v=>Math.round(v*100)/100;
function clearPiece(G,side,key){ if(G.phase!=='place') return; const p=G.side[side].pieces.find(x=>x.key===key); if(p) p.pos=null; }
function mapInfo(G){ return {tiles:G.tiles.map(r=>r.join('')),road:G.map.road.map(r=>r.map(v=>v?'1':'0').join('')),pads:G.pads,nRoutes:G.map.nRoutes,mapId:G.mapDef.id,decor:G.decor}; }
function snapshot(G,side){
  const e=[];
  G.ents.forEach(x=>{
    if(x.dead&&x.type!=='heart') return;
    if(x.kind==='unit') e.push([x.id,0,x.team,x.key,r2(x.x),r2(x.y),Math.round(x.hp),x.maxhp,x.r,x.moving>0?1:0,x.pend>0?r2(1-x.pend/x.pw):0,x.atk>0?r2(1-x.atk/.3):0,r2(x.ang||0),x.grounded>0?1:0,x.st.freeze>0?1:0,x.st.root>0?1:0,x.st.slow>0?1:0,x.st.silence>0?1:0,x.hit>0?1:0]);
    else if(x.type!=='trap') e.push([x.id,1,x.team,x.key,r2(x.x),r2(x.y),Math.round(x.hp),x.maxhp,x.type,x.tx==null?-1:x.tx,x.ty==null?-1:x.ty,r2(x.atk>0?x.atk:0),x.hit>0?1:0,x.st.silence>0?1:0,x.dead?1:0]);
  });
  const ice=[]; for(let r=0;r<H;r++) for(let c=0;c<W;c++) if(G.ice[r][c]>G.t) ice.push([c,r,r2(G.ice[r][c]-G.t)]);
  const S=G.side[side];
  const m={t:'s',ph:G.phase,pt:r2(G.placeT),tm:r2(G.t),ov:G.over?1:0,wn:G.winner,sh:G.shakeOut?r2(G.shakeOut):0,m:r2(S.mana),h:S.hand,q:S.queue[0],e:e,ice:ice,
    p:G.proj.map(p=>[p.id,r2(p.x),r2(p.y),p.ty==='magic'?1:0,p.fire?1:0,p.aoe||0,p.kind||'']),
    f:G.fxOut?G.fxOut.splice(0).map(f=>Object.assign({},f,{t:0})):[]};
  if(G.phase==='place') m.sp=S.pieces.filter(p=>p.pos).map(p=>[p.key,p.pos.c,p.pos.r]);
  G.shakeOut=0;
  return m;
}
function makeView(init,deck,side){

  else if(st.mv) ph=Math.floor(((st.ph%1)+1)%1*NW)%NW;
  const fly=!!FLYERS[key];
  let f;
  if(fly){ const per=.4488, idx=Math.floor(((t%per)/per)*10)%10; f=flyFrame(key,team,idx,clamp(Math.ceil((st.aw||0)*4),0,4),clamp(Math.ceil((st.at||0)*4),0,4)); }
  else f=frame(key,team,st.pose==='b'?'b':(st.pose==='s'?'s':'f'),ph,aw,at);
  g.save(); g.translate(x,y);
  const bs=st.born==null?1:st.born;
  const pop=bs<1?(1+Math.sin(bs*PI)*.25)*Math.min(1,bs*3):1;
  const idle=(!st.mv&&aw===0&&at===0)?1+Math.sin(t*2.4)*.012:1;
  g.rotate(st.lean||0); g.scale((st.flip?-1:1)*s*pop*(st.sx||1),s*pop*idle*(st.sq||1));
  g.drawImage(f,-ANC.x,-ANC.y);
  if(st.hit>0){ const tint=tinted(f); g.globalAlpha=Math.min(1,st.hit*6); g.drawImage(tint,-ANC.x,-ANC.y); g.globalAlpha=1; }
  g.restore();
}
const TINT=new WeakMap();
function tinted(f){ let t=TINT.get(f); if(t) return t; t=canvas(FR,FR); const q=t.getContext('2d'); q.drawImage(f,0,0); q.globalCompositeOperation='source-atop'; q.fillStyle='rgba(255,255,255,.75)'; q.fillRect(0,0,FR,FR); TINT.set(f,t); return t; }

/* construções */
const SFR=128, SANC={x:64,y:104};
function structFrame(key,team){
  const k='S|'+key+'|'+team; let c=CACHE.get(k); if(c) return c;
  c=canvas(SFR,SFR); const g=c.getContext('2d'); const sc=key==='heart'?SFR/110:SFR/84; g.translate(SANC.x,SANC.y-24*sc); g.scale(sc,sc);
  if(B[key]) B[key](g,TC[team]); CACHE.set(k,c); return c;
}
function struct(g,key,team,x,y,size,st){
  const f=structFrame(key,team), s=size/SFR, sc=key==='heart'?SFR/110:SFR/84; st=st||{};
  g.save(); g.translate(x,y); g.scale(s,s);
  const bs=st.born==null?1:st.born;
  if(bs<1){ const k=Math.min(1,bs*1.2); g.scale(1,.35+.65*k); g.globalAlpha=Math.min(1,bs*3); }
  g.drawImage(f,-SANC.x,-SANC.y);
  g.save(); g.translate(0,-24*sc); g.scale(sc,sc); dynStruct(g,key,TC[team],0,0,1,st); g.restore();
  if(st.hit>0){ const t=tinted2(f); g.globalAlpha=Math.min(.6,st.hit*5); g.drawImage(t,-SANC.x,-SANC.y); g.globalAlpha=1; }
  g.restore();
}
function tinted2(f){ let t=TINT.get(f); if(t) return t; t=canvas(SFR,SFR); const q=t.getContext('2d'); q.drawImage(f,0,0); q.globalCompositeOperation='source-atop'; q.fillStyle='rgba(255,255,255,.8)'; q.fillRect(0,0,SFR,SFR); TINT.set(f,t); return t; }

/* retratos das cartas */
const PORT={};
function portrait(key,tipo){
  if(PORT[key]) return PORT[key];
  const c=canvas(128,128), g=c.getContext('2d');
  g.translate(64,70);
  if(SP[key]){ const s=1.7; g.scale(s,s); SP[key](g); }
  else if(B[key]&&key!=='heart'){ const s=1.7; g.translate(0,-18); g.scale(s,s); B[key](g,TC[0]); dynStruct(g,key,TC[0],0,0,1,{t:.6,dir:-1}); }
  else { const s=1.55; g.translate(0,-6); g.scale(s,s); const f=FLYERS[key]; drawRaw(g,key,0,{pose:'f',mv:false,ph:0,aw:0,at:0,t:.4}); }
  PORT[key]=c.toDataURL('image/png'); return PORT[key];
}


function pthL(g,f,s,lw){ if(f){g.fillStyle=f;g.fill();} if(s){g.lineWidth=lw||1.6;g.lineJoin='round';g.strokeStyle=s;g.stroke();} }
function lE(g,x,y,rx,ry,f,s,lw){ g.beginPath(); g.ellipse(x,y,rx,ry,0,0,6.2832); pthL(g,f,s,lw); }
function lR(g,x,y,w,h,r,f,s,lw){ r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2); g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); pthL(g,f,s,lw); }
function lP(g,pts,f,s,lw){ g.beginPath(); for(let i=0;i<pts.length;i++){ if(i) g.lineTo(pts[i][0],pts[i][1]); else g.moveTo(pts[i][0],pts[i][1]); } g.closePath(); pthL(g,f,s,lw); }
return {TC,OL,unit,struct,portrait,E,R,P,L,C,glow,lit,dk,mix,SP,FLYERS,lE,lR,lP,shadowE,B,CH,CR};
})();

/* ---------- rede: PeerJS (sala por código e busca de oponente) ---------- */
function clean(s){ return String(s==null?'':s).replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2066-\u2069]/g,'').trim().slice(0,14); }
const NETX=(function(){
  const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}];
  const SLOTS=12, PRE='vald-mm-', ROOM='vald-r-';
  const CONN={reliable:true,serialization:'json'};
  const ok=()=>typeof window.Peer==='function';
  const mk=id=>{ const o={debug:0,config:{iceServers:ICE}}; return id?new window.Peer(id,o):new window.Peer(undefined,o); };
  let cur=null;
  function clearT(s){ (s.timers||[]).forEach(t=>{ clearTimeout(t); clearInterval(t); }); s.timers=[]; }
  function cancel(){ if(!cur) return; const c=cur; cur=null; c.dead=true; clearT(c); try{ if(c.peer) c.peer.destroy(); }catch(e){} }
  function code(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; const b=new Uint32Array(5); try{ crypto.getRandomValues(b); }catch(e){ for(let i=0;i<5;i++) b[i]=Math.floor(Math.random()*1e9); } for(let i=0;i<5;i++) s+=A[b[i]%A.length]; return s; }
  const netErr=e=>(e&&(e.type==='network'||e.type==='server-error'||e.type==='socket-error'||e.type==='socket-closed'))?'Servidor de conexão indisponível. Tente de novo.':'Erro de conexão'+(e&&e.type?' ('+e.type+')':'');
  function host(cb){
    cancel(); const sess=cur={timers:[]}; let tries=0;
    const open=()=>{
      const c=code(), p=mk(ROOM+c); sess.peer=p;
      p.on('open',()=>{ if(!sess.dead) cb.code(c); });
      p.on('connection',cn=>{
        if(sess.dead) return;
        if(sess.got){ try{ cn.close(); }catch(e){} return; }
        sess.got=true; cn.on('open',()=>{ if(sess.dead) return; cur=null; clearT(sess); cb.conn(cn,p,'host'); });
      });
      p.on('error',e=>{ if(sess.dead) return; if(e.type==='unavailable-id'&&tries++<4){ try{ p.destroy(); }catch(_){} open(); } else { cb.err(netErr(e)); cancel(); } });
    };
    open();
  }
  function join(c,cb){
    cancel(); const sess=cur={timers:[]}; const p=mk(); sess.peer=p;
    sess.timers.push(setTimeout(()=>{ if(!sess.dead&&!sess.ok){ cb.err('Sala não encontrada (tempo esgotado).'); cancel(); } },15000));
    p.on('open',()=>{
      if(sess.dead) return; const cn=p.connect(ROOM+c,CONN);
      cn.on('open',()=>{ if(sess.dead) return; sess.ok=true; cur=null; clearT(sess); cb.conn(cn,p,'guest'); });
      cn.on('error',()=>{ if(!sess.dead&&!sess.ok){ cb.err('Falha ao conectar na sala.'); cancel(); } });
    });
    p.on('error',e=>{ if(sess.dead||sess.ok) return; cb.err(e.type==='peer-unavailable'?'Sala não encontrada. Confira o código.':netErr(e)); cancel(); });
  }
  function find(cb){
    cancel(); const sess=cur={timers:[]}; const t0=Date.now();
    let matched=false, regTries=0;
    const order=Array.from({length:SLOTS},(_,i)=>i).sort(()=>Math.random()-.5);
    const fin=(cn,p,role)=>{ if(matched||sess.dead) return; matched=true; cur=null; clearT(sess); cb.conn(cn,p,role); };
    function wire(p,slot){
      p.on('connection',cn=>{ cn.on('data',m=>{ if(m&&m.t==='mm'){ if(matched||sess.dead){ try{ cn.send({t:'busy'}); }catch(e){} setTimeout(()=>{ try{ cn.close(); }catch(e){} },300); return; } try{ cn.send({t:'mm-ok'}); }catch(e){} fin(cn,p,'host'); } }); });
      p.on('error',()=>{});
      const scan=setInterval(()=>{
        if(matched||sess.dead) return;
        const cands=order.filter(s=>s<slot); if(!cands.length) return;
        const s=cands[Math.floor(Math.random()*cands.length)];
        let cn; try{ cn=p.connect(PRE+s,CONN); }catch(e){ return; }
        const tt=setTimeout(()=>{ try{ if(!matched) cn.close(); }catch(e){} },3000); sess.timers.push(tt);
        cn.on('open',()=>{ try{ cn.send({t:'mm'}); }catch(e){} });
        cn.on('data',m=>{ if(m&&m.t==='mm-ok') fin(cn,p,'guest'); else if(m&&m.t==='busy'){ try{ cn.close(); }catch(e){} } });
      },1300); sess.timers.push(scan);
    }
    function reg(){
      if(sess.dead) return;
      if(regTries>=order.length){ const p=mk(); sess.peer=p; wire(p,Infinity); return; }
      const slot=order[regTries++], p=mk(PRE+slot); sess.peer=p; let opened=false;
      p.on('open',()=>{ if(sess.dead){ try{ p.destroy(); }catch(_){} return; } opened=true; wire(p,slot); });
      p.on('error',e=>{ if(sess.dead||opened) return; if(e.type==='unavailable-id'){ try{ p.destroy(); }catch(_){} reg(); } else { cb.err(netErr(e)); cancel(); } });
    }
    sess.timers.push(setInterval(()=>cb.status(Math.max(0,30-Math.floor((Date.now()-t0)/1000))),500));
    sess.timers.push(setTimeout(()=>{ if(!matched&&!sess.dead){ cancel(); cb.timeout(); } },30000));
    reg();
  }
  return {ok,host,join,find,cancel,code};
})();

/* ---------- menu de batalha ---------- */
const B={mode:'ai',diff:1,d1:0};
const ON={state:'idle',msg:'',secs:30,code:'',statEl:null};

function deckList(){
  const wrap=el('div'); wrap.appendChild(el('h3',null,'Seu deck'));
  const box=el('div','decks');
  S.decks.forEach((d,i)=>{
    const v=CM.validateDeck(d.cards);
    const b=el('button','dk'+(i===B.d1?' on':'')); b.type='button'; b.disabled=!v.ok||ON.state!=='idle';
    b.appendChild(el('b',null,d.name));
    if(v.ok){ const f=el('div','faces'); d.cards.forEach(k=>f.appendChild(img(k,null,30))); b.appendChild(f); }
    else b.appendChild(el('small',null,d.cards.length?'Deck incompleto':'Vazio'));
    b.onclick=()=>{ B.d1=i; renderBMenu(); };
    box.appendChild(b);
  });
  wrap.appendChild(box); return wrap;
}
function onlinePanel(){
  const box=el('div'); box.appendChild(el('h3',null,'Online'));
  const nk=el('input','txt'); nk.maxLength=14; nk.value=store.get('nick',''); nk.placeholder='Seu apelido'; nk.setAttribute('aria-label','Seu apelido');
  nk.oninput=()=>store.set('nick',clean(nk.value)); box.appendChild(nk);
  if(!NETX.ok()){ box.appendChild(el('p','panelnote','A conexão online não está disponível: a biblioteca de rede não carregou. Verifique a internet e recarregue a página.')); return box; }
  const col=el('div','onl');
  if(ON.state==='idle'){
    const s=el('button','btn hot','🔎 Buscar oponente (até 30 s)'); s.type='button'; s.onclick=doSearch; col.appendChild(s);
    const h=el('button','btn cool','🏠 Criar sala'); h.type='button'; h.onclick=doHost; col.appendChild(h);
    const row=el('div','row'); const inp=el('input','txt'); inp.maxLength=8; inp.placeholder='Código da sala'; inp.autocapitalize='characters'; inp.autocomplete='off'; inp.setAttribute('aria-label','Código da sala'); inp.style.flex='1 1 140px'; inp.style.width='auto';
    const j=el('button','btn go','Entrar'); j.type='button'; j.onclick=()=>doJoin(inp.value);
    row.appendChild(inp); row.appendChild(j); col.appendChild(row);
  } else {
    const st=el('div','panelnote'); ON.statEl=st; col.appendChild(st); paintStatus();
    if(ON.state==='host'&&ON.code){ const c=el('div','code',ON.code); col.appendChild(c); const cp=el('button','btn small','Copiar código'); cp.type='button'; cp.onclick=()=>{ try{ navigator.clipboard.writeText(ON.code).then(()=>toast('Código copiado'),()=>{}); }catch(e){} }; col.appendChild(cp); }
    const cn=el('button','btn','Cancelar'); cn.type='button'; cn.onclick=cancelOnline; col.appendChild(cn);
  }
  if(ON.msg) col.appendChild(el('p','panelnote',ON.msg));
  box.appendChild(col); return box;
}
function paintStatus(){
  if(!ON.statEl) return;
  ON.statEl.textContent=ON.state==='search'?'Procurando oponente… '+ON.secs+' s':ON.state==='host'?(ON.code?'Passe este código ao seu amigo. Aguardando…':'Criando sala…'):'Entrando na sala…';
}
function guardOnline(){ if(!okDeck(B.d1)){ toast('Escolha um deck válido'); return false; } if(!NETX.ok()){ toast('Conexão online indisponível'); return false; } return true; }
function cancelOnline(){ NETX.cancel(); ON.state='idle'; ON.msg=''; ON.code=''; renderBMenu(); }
function doSearch(){
  if(!guardOnline()) return; ON.state='search'; ON.msg=''; ON.secs=30; renderBMenu();
  NETX.find({status:s=>{ ON.secs=s; paintStatus(); },conn:(cn,p,role)=>netStart(cn,p,role),
    err:m=>{ ON.state='idle'; ON.msg=m; renderBMenu(); },
    timeout:()=>{ ON.state='idle'; ON.msg='Nenhum jogador encontrado em 30 s. Tente de novo ou crie uma sala.'; renderBMenu(); }});
}
function doHost(){
  if(!guardOnline()) return; ON.state='host'; ON.msg=''; ON.code=''; renderBMenu();
  NETX.host({code:c=>{ ON.code=c; renderBMenu(); },conn:(cn,p,role)=>netStart(cn,p,role),err:m=>{ ON.state='idle'; ON.msg=m; ON.code=''; renderBMenu(); }});
}
function doJoin(v){
  if(!guardOnline()) return;
  const c=String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length<4){ toast('Digite o código da sala'); return; }
  ON.state='join'; ON.msg=''; renderBMenu();
  NETX.join(c,{conn:(cn,p,role)=>netStart(cn,p,role),err:m=>{ ON.state='idle'; ON.msg=m; renderBMenu(); }});
}
function renderBMenu(){
  const root=$('#bm-body'); root.innerHTML='';
  const valid=S.decks.map((d,i)=>i).filter(okDeck);
  if(!okDeck(B.d1)) B.d1=okDeck(S.main)?S.main:(valid[0]||0);
  const seg=el('div','seg');
  [['ai','🤖 Contra a máquina'],['online','🌐 Online']].forEach(m=>{
    const b=el('button','btn'+(B.mode===m[0]?' cool':'')+' small',m[1]); b.type='button'; b.disabled=ON.state!=='idle';
    b.onclick=()=>{ B.mode=m[0]; renderBMenu(); }; seg.appendChild(b);
  });
  root.appendChild(seg);
  if(B.mode==='ai'){
    const ds=el('div','seg'); ds.appendChild(el('b','pt','Dificuldade'));
    ['Fácil','Normal','Difícil'].forEach((n,i)=>{ const b=el('button','btn small'+(B.diff===i?' cool':''),n); b.type='button'; b.onclick=()=>{ B.diff=i; renderBMenu(); }; ds.appendChild(b); });
    root.appendChild(ds);
  }
  const cols=el('div','bmcols'); cols.appendChild(deckList());
  if(B.mode==='online') cols.appendChild(onlinePanel());
  root.appendChild(cols);
  $('#bm-start').hidden=B.mode!=='ai'; $('#bm-start').disabled=!okDeck(B.d1);
  $('#bm-note').textContent=!valid.length?'Nenhum deck válido ainda. Abra o editor para montar um.':(B.mode==='online'?'O online usa conexão direta entre os dois aparelhos (WebRTC). Em redes muito restritas pode não conectar.':'');
}
$('#bm-back').onclick=()=>{ if(ON.state!=='idle') cancelOnline(); renderHome(); show('home'); };
$('#bm-edit').onclick=()=>{ if(ON.state!=='idle') cancelOnline(); edSlot=B.d1; renderEditor(); show('editor'); };
$('#bm-start').onclick=()=>startAI();

/* ---------- cenário (fundo desenhado uma vez por partida) ---------- */
function mulb(seed){ let a=seed>>>0; return function(){ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
const THEME={
  floresta:{ground:'#6BB04E',g2:'#7CC25B',g3:'#5A9F40',road:'#D2B07A',edge:'#9C7B45',pebble:'#B8955C',slow:'rgba(92,62,28,.55)',plaza:'#C9B58A'},
  ruinas:{ground:'#8FA08A',g2:'#A0B09A',g3:'#7C8E78',road:'#C4BCA8',edge:'#7C7566',pebble:'#A39B87',slow:'rgba(90,90,90,.45)',plaza:'#CFC7B2'},
  montanha:{ground:'#DDE7F0',g2:'#EAF1F7',g3:'#C9D6E3',road:'#B5A89A',edge:'#7E7165',pebble:'#9C8F82',slow:'rgba(255,255,255,.75)',plaza:'#D8CFC4'},
  lava:{ground:'#3A2A2F',g2:'#4A353B',g3:'#2E2025',road:'#7A5A52',edge:'#2A1A1E',pebble:'#5E433D',slow:'rgba(255,100,30,.6)',plaza:'#6B4D48'},
  ceu:{ground:'#BFE3FF',g2:'#E6F5FF',g3:'#A8D2F5',road:'#FFF4D6',edge:'#E2C887',pebble:'#F2E2B0',slow:'rgba(255,255,255,.8)',plaza:'#FFF0C4'},
  deserto:{ground:'#E8CB8E',g2:'#F1D9A2',g3:'#DDB872',road:'#F6E3B4',edge:'#C79F5B',pebble:'#D9BE83',slow:'rgba(176,112,38,.42)',plaza:'#F0DBA8'}
};
function decorTree(g,x,y,s,rng){
  const k=.8+rng()*.5, w=s*k;
  g.fillStyle='rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(x,y+w*.32,w*.36,w*.12,0,0,7); g.fill();
  ART.lR(g,x-w*.06,y-w*.05,w*.12,w*.38,2,'#6B4423','#3F2814',1);
  const cols=['#2F7D32','#3B9440','#4DAA4A'];
  [[0,-.42,.4],[-.22,-.24,.3],[.22,-.26,.3]].forEach((c,i)=>ART.lE(g,x+c[0]*w,y+c[1]*w,c[2]*w,c[2]*w*.92,cols[i],'#1E5A24',1.2));
  ART.lE(g,x-w*.1,y-w*.55,w*.14,w*.1,'rgba(160,255,140,.55)');
}
function decorBush(g,x,y,s,rng){
  const w=s*(.45+rng()*.25);
  g.fillStyle='rgba(0,0,0,.15)'; g.beginPath(); g.ellipse(x,y+w*.3,w*.5,w*.14,0,0,7); g.fill();
  ART.lE(g,x-w*.25,y,w*.3,w*.26,'#3E9B3F','#1E5A24',1); ART.lE(g,x+w*.2,y-w*.05,w*.32,w*.28,'#4DAA4A','#1E5A24',1);
  if(rng()<.5){ ART.lE(g,x,y-w*.12,w*.07,w*.07,'#FF6FA5'); }
}
function decorRock(g,x,y,s,rng,col){
  const w=s*(.35+rng()*.25);
  g.fillStyle='rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(x,y+w*.35,w*.55,w*.14,0,0,7); g.fill();
  ART.lP(g,[[x-w*.5,y+w*.3],[x-w*.4,y-w*.2],[x-w*.05,y-w*.45],[x+w*.4,y-w*.2],[x+w*.5,y+w*.3]],col||'#9A9AA6','#4A4A58',1.3);
  ART.lP(g,[[x-w*.3,y-w*.1],[x-w*.05,y-w*.35],[x+w*.1,y-w*.1]],'rgba(255,255,255,.3)');
}
function decorPillar(g,x,y,s,rng){
  const w=s*(.9+rng()*.4), broken=rng()<.5;
  g.fillStyle='rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(x,y+w*.34,w*.36,w*.1,0,0,7); g.fill();
  ART.lR(g,x-w*.24,y+w*.18,w*.48,w*.16,2,'#B9B2A0','#5E5848',1.2);
  const top=broken?y-w*.15:y-w*.45;
  ART.lR(g,x-w*.17,top,w*.34,y+w*.2-top,2,'#D6CFBC','#5E5848',1.2);
  L2(g,x-w*.06,top+2,x-w*.06,y+w*.18); L2(g,x+w*.07,top+2,x+w*.07,y+w*.18);
  if(broken) ART.lP(g,[[x-w*.17,top],[x-w*.05,top-w*.1],[x+.02*w,top],[x+w*.1,top-w*.07],[x+w*.17,top]],'#D6CFBC','#5E5848',1.1);
  else ART.lR(g,x-w*.26,top-w*.08,w*.52,w*.1,2,'#E2DBC8','#5E5848',1.2);
  if(rng()<.5) ART.lE(g,x-w*.12,y+w*.1,w*.1,w*.06,'#6FA05A');
}
function L2(g,x1,y1,x2,y2){ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.lineWidth=1; g.strokeStyle='rgba(60,50,30,.35)'; g.stroke(); }
function decorWall(g,x,y,s,rng){
  const w=s*(.8+rng()*.3);
  g.fillStyle='rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(x,y+w*.32,w*.5,w*.1,0,0,7); g.fill();
  for(let r=0;r<3;r++) for(let c=0;c<(r===2?1:2);c++){
    ART.lR(g,x-w*.42+c*w*.42+(r%2)*w*.12,y+w*.18-r*w*.2,w*.4,w*.18,2,r%2?'#C2BBA8':'#CFC8B4','#5E5848',1);
  }
}
function decorDune(g,x,y,s,rng){
  const w=s*(.9+rng()*.5);
  const gr=g.createLinearGradient(x,y-w*.3,x,y+w*.3); gr.addColorStop(0,'#F5DDA3'); gr.addColorStop(1,'#D3A85F');
  g.fillStyle=gr; g.beginPath(); g.ellipse(x,y,w*.55,w*.3,0,0,7); g.fill();
  g.strokeStyle='rgba(150,100,40,.35)'; g.lineWidth=1.2; g.beginPath(); g.ellipse(x,y,w*.55,w*.3,0,3.3,6.1); g.stroke();
}
function decorCactus(g,x,y,s,rng){
  const w=s*(.8+rng()*.3);
  g.fillStyle='rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(x,y+w*.34,w*.3,w*.09,0,0,7); g.fill();
  ART.lR(g,x-w*.1,y-w*.38,w*.2,w*.72,w*.1,'#3F9A52','#1F5A2E',1.2);
  ART.lR(g,x-w*.32,y-w*.18,w*.22,w*.13,w*.06,'#3F9A52','#1F5A2E',1.1); ART.lR(g,x-w*.32,y-w*.3,w*.11,w*.2,w*.05,'#3F9A52','#1F5A2E',1.1);
  ART.lR(g,x+w*.1,y-w*.05,w*.22,w*.13,w*.06,'#3F9A52','#1F5A2E',1.1); ART.lR(g,x+w*.21,y-w*.2,w*.11,w*.2,w*.05,'#3F9A52','#1F5A2E',1.1);
  if(rng()<.5) ART.lE(g,x,y-w*.4,w*.05,w*.05,'#FF6FA5');
}
function decorCloud(g,x,y,s,rng){ const w=s*(.8+rng()*.5); g.fillStyle='rgba(120,160,210,.2)'; g.beginPath(); g.ellipse(x,y+w*.3,w*.55,w*.1,0,0,7); g.fill(); [[-.25,0,.28],[0,-.12,.34],[.27,0,.26],[0,.05,.4]].forEach(c=>ART.lE(g,x+c[0]*w,y+c[1]*w,c[2]*w,c[2]*w*.7,'#fff','rgba(150,180,220,.6)',1)); }
function decorLava(g,x,y,s,rng){ const w=s*(.5+rng()*.3); const gr=g.createRadialGradient(x,y,w*.1,x,y,w*.8); gr.addColorStop(0,'#FFD23F'); gr.addColorStop(.5,'#FF6A1F'); gr.addColorStop(1,'rgba(255,60,20,0)'); g.fillStyle=gr; g.beginPath(); g.ellipse(x,y,w*.8,w*.55,0,0,7); g.fill(); }
function renderBG(G,T,dpr,flip){
  const W=CM.W, H=CM.H, c=document.createElement('canvas');
  c.width=Math.floor(W*T*dpr); c.height=Math.floor(H*T*dpr);
  const g=c.getContext('2d'); g.scale(dpr,dpr);
  const th=THEME[G.mapDef.id], rng=mulb(G.decor);
  const rot=a=>a.map((_,r)=>a[H-1-r].slice().reverse());
  let tiles=G.tiles, road=G.map.road; if(flip){ tiles=rot(tiles); road=rot(road); }
  const padsL=flip?G.pads.map(l=>l.map(p=>({c:W-1-p.c,r:H-1-p.r,kind:p.kind}))):G.pads;
  g.fillStyle=th.ground; g.fillRect(0,0,W*T,H*T);
  for(let i=0;i<150;i++){ g.globalAlpha=.35; g.fillStyle=rng()<.5?th.g2:th.g3; g.beginPath(); g.ellipse(rng()*W*T,rng()*H*T,T*(.4+rng()*1.1),T*(.25+rng()*.7),rng()*3,0,7); g.fill(); }
  g.globalAlpha=1;
  const isRoad=(cc,rr)=>cc>=0&&rr>=0&&cc<W&&rr<H&&(road[rr][cc]||tiles[rr][cc]==='~'||(tiles[rr][cc]==='p'&&road[rr][cc]));
  const drawRoad=(rad,col)=>{
    g.fillStyle=col;
    for(let r=0;r<H;r++) for(let cc=0;cc<W;cc++) if(isRoad(cc,r)){
      const x=(cc+.5)*T, y=(r+.5)*T;
      g.beginPath(); g.arc(x,y,rad*T,0,7); g.fill();
      if(isRoad(cc+1,r)){ g.beginPath(); g.arc(x+T/2,y,rad*T,0,7); g.fill(); }
      if(isRoad(cc,r+1)){ g.beginPath(); g.arc(x,y+T/2,rad*T,0,7); g.fill(); }
    }
  };
  drawRoad(.98,th.edge); drawRoad(.84,th.road);
  // textura da estrada
  for(let r=0;r<H;r++) for(let cc=0;cc<W;cc++) if(isRoad(cc,r)){
    for(let k=0;k<4;k++){ g.fillStyle=th.pebble; g.globalAlpha=.55; g.beginPath(); g.ellipse((cc+rng())*T,(r+rng())*T,T*.05,T*.035,rng()*3,0,7); g.fill(); }
  }
  g.globalAlpha=1;
  // trechos lentos
  for(let r=0;r<H;r++) for(let cc=0;cc<W;cc++) if(tiles[r][cc]==='~'){
    g.fillStyle=th.slow; g.beginPath(); g.ellipse((cc+.5)*T,(r+.5)*T,T*.62,T*.48,rng()*3,0,7); g.fill();
    for(let k=0;k<3;k++){ g.fillStyle='rgba(255,255,255,.22)'; g.beginPath(); g.ellipse((cc+.2+rng()*.6)*T,(r+.2+rng()*.6)*T,T*.07,T*.04,0,0,7); g.fill(); }
  }
  // praças dos castelos
  [[W/2,1],[W/2,H-1]].forEach(p=>{ g.fillStyle=th.plaza; g.strokeStyle=th.edge; g.lineWidth=2; g.beginPath(); g.ellipse(p[0]*T,p[1]*T,2.3*T,2*T,0,0,7); g.fill(); g.stroke(); });
  // cenário nos blocos bloqueados
  const items=[];
  for(let r=0;r<H;r++) for(let cc=0;cc<W;cc++) if(tiles[r][cc]==='#'){
    const near=[[1,0],[-1,0],[0,1],[0,-1]].some(d=>isRoad(cc+d[0],r+d[1]));
    const n=near?1:2;
    for(let k=0;k<n;k++) items.push({x:(cc+.3+rng()*.4+(k?(rng()-.5)*.6:0))*T,y:(r+.6+rng()*.3)*T,near:near});
  }
  items.sort((a,b)=>a.y-b.y);
  items.forEach(it0=>{
    g.save(); const it=it0;
    const id=G.mapDef.id, q=rng();
    if(id==='floresta'){ if(q<.72) decorTree(g,it.x,it.y,T*1.25,rng); else if(q<.9) decorBush(g,it.x,it.y,T,rng); else decorRock(g,it.x,it.y,T,rng,'#8E9A8C'); }
    else if(id==='ruinas'){ if(q<.35) decorPillar(g,it.x,it.y,T*1.1,rng); else if(q<.6) decorWall(g,it.x,it.y,T,rng); else if(q<.85) decorRock(g,it.x,it.y,T,rng,'#A9A593'); else decorBush(g,it.x,it.y,T*.8,rng); }
    else if(id==='montanha'){ if(q<.55) decorRock(g,it.x,it.y,T*1.4,rng,'#8C9BAA'); else if(q<.85) decorTree(g,it.x,it.y,T*1.2,rng); else decorRock(g,it.x,it.y,T,rng,'#C9D6E3'); }
    else if(id==='lava'){ if(q<.55) decorRock(g,it.x,it.y,T*1.3,rng,'#4B3036'); else if(q<.85) decorLava(g,it.x,it.y,T*1.2,rng); else decorRock(g,it.x,it.y,T,rng,'#6B4A44'); }
    else if(id==='ceu'){ if(q<.55) decorCloud(g,it.x,it.y,T*1.3,rng); else if(q<.85) decorPillar(g,it.x,it.y,T*1.2,rng); else decorCloud(g,it.x,it.y,T,rng); }
    else { if(q<.4) decorDune(g,it.x,it.y,T*1.1,rng); else if(q<.65) decorCactus(g,it.x,it.y,T*1.1,rng); else decorRock(g,it.x,it.y,T,rng,'#B9805A'); }
    g.restore();
  });
  // plataformas de construção
  padsL.forEach(list=>list.forEach(p=>{
    const x=(p.c+.5)*T, y=(p.r+.5)*T;
    ART.lE(g,x,y+T*.06,T*.56,T*.46,'#6F6654',null);
    ART.lE(g,x,y,T*.55,T*.45,'#D8D1BE','#5E5848',1.6); ART.lE(g,x,y,T*.38,T*.3,null,'rgba(94,88,72,.55)',1);
  }));
  const lg=g.createLinearGradient(0,0,W*T,H*T); lg.addColorStop(0,'rgba(255,255,230,.10)'); lg.addColorStop(1,'rgba(20,10,50,.10)'); g.fillStyle=lg; g.fillRect(0,0,W*T,H*T);
  const vg=g.createRadialGradient(W*T/2,H*T/2,Math.min(W,H)*T*.35,W*T/2,H*T/2,Math.max(W,H)*T*.78); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(20,8,40,.34)'); g.fillStyle=vg; g.fillRect(0,0,W*T,H*T);
  return c;
}

/* ---------- batalha ---------- */
const cv=$('#cv'), ctx=cv.getContext('2d');
const U={G:null,me:0,T:25,dpr:1,bg:null,sel:null,selPiece:null,ptr:null,revealT:0,startT:0,raf:0,last:0,ended:false,time:0,dt:0,frame:0,sig:'',net:null,ready:[false,false],snapAcc:0,oppNick:'Rival',shake:0,scorch:[],aiIdx:0,mi:null,mt:null,battleShown:false};
const HALF=CM.HALF, W=CM.W, H=CM.H;
const VS=new Map(), PTR=new Map();
const isGuest=()=>!!(U.net&&U.net.role==='guest');
const isHost=()=>!!(U.net&&U.net.role==='host');
const hash=n=>{ n=Math.sin(n*127.1+311.7)*43758.5453; return n-Math.floor(n); };
const ease=k=>1-Math.pow(1-k,3);
const angd=(a,b)=>{ let d=a-b; while(d>Math.PI) d-=6.2832; while(d<-Math.PI) d+=6.2832; return d; };
const PX=(x,y)=>U.me?[(W-x)*U.T,(H-y)*U.T]:[x*U.T,y*U.T];
const VT=(c,r)=>U.me?[W-1-c,H-1-r]:[c,r];
const vt=e=>e.team===U.me?0:1;

/* ---------- sessão online ---------- */
function send(m){ if(U.net&&U.net.cn){ try{ U.net.cn.send(m); }catch(e){} } }
function closeNet(){ const N=U.net; if(!N) return; U.net=null; clearInterval(N.hb); try{ N.cn.close(); }catch(e){} try{ N.peer.destroy(); }catch(e){} }
function netStart(cn,peer,role){
  ON.state='idle'; ON.code=''; ON.msg=''; closeNet();
  const N=U.net={cn:cn,peer:peer,role:role,last:performance.now(),started:false,hb:null,closing:false};
  cn.on('data',netData); cn.on('close',()=>netClosed('close')); cn.on('error',()=>netClosed('error'));
  N.hb=setInterval(()=>{ send({t:'ping'}); if(performance.now()-N.last>9000) netClosed('timeout'); },2000);
  toast('Conectado! Iniciando a partida…');
  if(role==='guest') send({t:'hello',nick:myNick(),deck:S.decks[B.d1].cards.slice()});
}
function netData(m){
  const N=U.net; if(!N||!m||typeof m!=='object') return; N.last=performance.now();
  if(m.t==='ping'){ send({t:'pong'}); return; }
  if(m.t==='pong') return;
  if(m.t==='bye'){ netClosed('bye'); return; }
  if(N.role==='host') hostMsg(m); else guestMsg(m);
}
function hostMsg(m){
  const N=U.net, G=U.G;
  if(m.t==='hello'){ if(!N.started) hostBegin(m); return; }
  if(!G||!N.started) return;
  if(m.t==='place'&&G.phase==='place'&&typeof m.key==='string'&&Number.isInteger(m.c)&&Number.isInteger(m.r)&&!U.ready[1]) CM.setPiece(G,1,m.key,m.c,m.r);
  else if(m.t==='unplace'&&typeof m.key==='string'&&!U.ready[1]) CM.clearPiece(G,1,m.key);
  else if(m.t==='ready') U.ready[1]=true;
  else if(m.t==='play'&&Number.isInteger(m.i)&&m.i>=0&&m.i<5&&isFinite(m.x)&&isFinite(m.y)) CM.playCard(G,1,m.i,+m.x,+m.y);
  else if(m.t==='swap'&&Number.isInteger(m.i)&&m.i>=0&&m.i<5) CM.discard(G,1,m.i);
}
function hostBegin(m){
  const N=U.net, deck=Array.isArray(m.deck)?m.deck.filter(k=>typeof k==='string'&&CM.CARDS[k]):[];
  if(!Array.isArray(m.deck)||deck.length!==m.deck.length||!CM.validateDeck(deck).ok){ send({t:'err',msg:'Deck inválido'}); netClosed('bad'); return; }
  N.started=true; U.oppNick=clean(m.nick)||'Jogador';
  U.G=CM.createGame({deckP:S.decks[B.d1].cards.slice(),deckA:deck,pvp:true,net:true});
  U.me=0; U.aiIdx=-1;
  send(Object.assign({t:'start',nick:myNick()},CM.mapInfo(U.G)));
  beginGameUI();
}
function guestMsg(m){
  const N=U.net;
  if(m.t==='start'&&!N.started){
    if(!Array.isArray(m.tiles)||!Array.isArray(m.pads)){ netClosed('bad'); return; }
    N.started=true; U.oppNick=clean(m.nick)||'Jogador'; U.G=CM.makeView(m,S.decks[B.d1].cards,1); U.me=1; U.aiIdx=-1; beginGameUI();
  } else if(m.t==='s'&&U.G&&N.started&&Array.isArray(m.e)){ CM.applySnap(U.G,m,performance.now(),1); if(m.sh) U.shake=Math.max(U.shake,m.sh); }
  else if(m.t==='err'){ toast(m.msg||'Erro'); netClosed('bad'); }
}
function netClosed(why){
  const N=U.net; if(!N||N.closing) return; N.closing=true;
  if(N.started&&U.G&&!U.ended){
    U.ended=true; stopLoop();
    const box=el('div'); box.appendChild(el('h3',null,why==='bad'?'Partida cancelada':'Oponente desconectado'));
    box.appendChild(el('p',null,isHost()&&why!=='bad'?'Seu oponente saiu da partida. Vitória por abandono!':'A conexão com o oponente foi perdida.'));
    const row=el('div','row'); const b=el('button','btn hot','Menu'); b.type='button'; b.onclick=()=>{ closeModal(); leaveGame(); }; row.appendChild(b); box.appendChild(row); openModal(box);
  } else if(!N.started){ ON.msg='A conexão foi encerrada antes de começar.'; renderBMenu(); }
  closeNet();
}

function leaveGame(){ stopLoop(); if(U.net) send({t:'bye'}); closeNet(); U.G=null; ON.state='idle'; renderBMenu(); show('bmenu'); }
function tapPlace(c,r){
  const G=U.G, ps=G.side[U.me].pieces; if(U.ready[U.me]&&U.net) return;
  const at=ps.find(p=>p.pos&&p.pos.c===c&&p.pos.r===r);
  if(at){ at.pos=null; U.selPiece=at.key; if(isGuest()) send({t:'unplace',key:at.key}); return; }
  if(!U.selPiece||ps.find(p=>p.key===U.selPiece).pos){ const nx=ps.find(p=>!p.pos); if(nx) U.selPiece=nx.key; else return; }
  if(CM.setPiece(G,U.me,U.selPiece,c,r)){
    if(isGuest()) send({t:'place',key:U.selPiece,c:c,r:r});
    const nx=ps.find(p=>!p.pos); U.selPiece=nx?nx.key:null;
  } else toast('Use um dos pontos de construção do seu lado');
}
function toLogic(e){
  const rect=cv.getBoundingClientRect(); const vx=(e.clientX-rect.left)/rect.width*W, vy=(e.clientY-rect.top)/rect.height*H;
  return {vx:vx,vy:vy,x:U.me?W-vx:vx,y:U.me?H-vy:vy};
}
cv.addEventListener('pointerdown',e=>{
  if(!U.G||U.revealT>0||U.startT>0||U.ended) return;
  const p=toLogic(e), G=U.G; U.ptr={x:p.vx,y:p.vy};
  if(G.phase==='place'){ tapPlace(Math.floor(p.x),Math.floor(p.y)); return; }
  if(G.phase!=='battle'||U.sel==null) return;
  const r=doPlay(U.sel,p.x,p.y);

/* ---------- laço de atualização ---------- */
function fmt(t){ t=Math.max(0,Math.ceil(t)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
function hudUpdate(){
  const G=U.G, a=G.hearts[U.me], b=G.hearts[1-U.me];
  if(a) $('#hp-me').style.width=Math.max(0,a.hp/a.maxhp*100)+'%';
  if(b) $('#hp-foe').style.width=Math.max(0,b.hp/b.maxhp*100)+'%';
  $('#clock').textContent=fmt(G.phase==='battle'?CM.MATCH-G.t:CM.MATCH);
}
function pbarText(){ const G=U.G, p=$('#pbar'); p.hidden=false; p.textContent='Posicione · '+fmt(G.placeT)+(U.net&&U.ready[1-U.me]?' · rival pronto':''); }
function hostNet(dt){
  const N=U.net; if(!N||N.role!=='host'||!N.started) return;
  U.snapAcc+=dt; if(U.snapAcc>=.05){ U.snapAcc=0; send(CM.snapshot(U.G,1)); }
}
function update(dt){
  const G=U.G; if(!G) return;
  if(isGuest()){ updateGuest(dt); return; }
  if(G.shake){ U.shake=Math.max(U.shake,G.shake); G.shake=0; }
  if(U.revealT>0){
    U.revealT-=dt;
    if(U.revealT<=0){
      hideBanner(); const ps=G.side[0].pieces;
      if(ps.length){ U.selPiece=ps[0].key; } else { U.ready[0]=true; if(!U.net) G.placeT=0; }
      if(U.net&&!G.side[1].pieces.length) U.ready[1]=true;
      U.sig='';
    }
    hostNet(dt); return;
  }
  if(G.phase==='place'){
    G.placeT-=dt; if(U.net&&U.ready[0]&&U.ready[1]) G.placeT=0;
    pbarText(); updatePanel(); hudUpdate();
    if(G.placeT<=0){ CM.startBattle(G); $('#pbar').hidden=true; U.sel=null; U.sig=''; showBanner('Já!','A batalha começou'); U.startT=1; }
    hostNet(dt); return;
  }
  if(U.startT>0){ U.startT-=dt; if(U.startT<=0) hideBanner(); } else CM.step(G,dt);
  updatePanel(); hudUpdate(); hostNet(dt);
  if(G.over&&!U.ended){ U.ended=true; endGame(); }
}
function updateGuest(dt){
  const G=U.G;
  if(U.revealT>0){
    U.revealT-=dt;
    if(U.revealT<=0){ hideBanner(); const ps=G.side[1].pieces; if(ps.length) U.selPiece=ps[0].key; else { U.ready[1]=true; send({t:'ready'}); } U.sig=''; }
  }
  CM.interpView(G,performance.now()); CM.ageView(G,dt);
  if(G.shake){ U.shake=Math.max(U.shake,G.shake); G.shake=0; }
  if(U.revealT>0) return;
  if(G.phase==='place'){ pbarText(); } else { $('#pbar').hidden=true; if(!U.battleShown){ U.battleShown=true; showBanner('Já!','A batalha começou'); U.startT=1; U.sel=null; U.sig=''; } }
  if(U.startT>0){ U.startT-=dt; if(U.startT<=0) hideBanner(); }
  updatePanel(); hudUpdate();
  if(G.over&&!U.ended){ U.ended=true; endGame(); }
}
function endGame(){
  const G=U.G, w=G.winner, me=U.me;
  const box=el('div');
  box.appendChild(el('h3',null,w===me?'Vitória! 🏆':w===2?'Empate':'Derrota'));

  box.appendChild(el('p',null,dead?(w===me?'Você derrubou o Coração do rival.':'O seu Coração foi derrubado.'):'O tempo acabou; venceu quem tinha mais vida no Coração.'));
  box.appendChild(el('p','muted',U.net?'Oponente: '+U.oppNick:'Rival usou: '+S.decks[U.aiIdx].name));
  const row=el('div','row');
  const a=el('button','btn hot',U.net?'Voltar ao menu':'Jogar de novo'); a.type='button'; a.onclick=()=>{ closeModal(); if(U.net) leaveGame(); else startAI(); };
  const b=el('button','btn','Menu'); b.type='button'; b.onclick=()=>{ closeModal(); leaveGame(); };
  row.appendChild(b); row.appendChild(a); box.appendChild(row);
  setTimeout(()=>openModal(box),(G.hearts[0]&&G.hearts[0].dead)||(G.hearts[1]&&G.hearts[1].dead)?1600:600);

/* ---------- desenho ---------- */
function hpBar(x,y,w,e,v){
  const r=Math.max(0,e.hp/e.maxhp), hd=v?Math.max(r,v.hpd/e.maxhp):r;
  ctx.fillStyle='rgba(25,10,45,.85)'; ctx.fillRect(x-w/2-1.5,y-1.5,w+3,7);
  ctx.fillStyle='rgba(255,255,255,.85)'; ctx.fillRect(x-w/2,y,w*hd,4);
  ctx.fillStyle=vt(e)===0?'#5C93FF':'#FF6B6B'; ctx.fillRect(x-w/2,y,w*r,4);
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect(x-w/2,y,w*r,1.5);
}
const AMB={floresta:{c:'255,255,190',n:26,m:'float'},ruinas:{c:'255,240,210',n:20,m:'float'},deserto:{c:'255,228,160',n:30,m:'drift'},montanha:{c:'255,255,255',n:46,m:'snow'},lava:{c:'255,150,50',n:34,m:'ember'},ceu:{c:'255,255,255',n:24,m:'twinkle'}};
function ambient(t){
  const a=AMB[U.G.mapDef.id]; if(!a) return; const T=U.T, w=W*T, h=H*T;
  for(let i=0;i<a.n;i++){
    const h1=hash(i+1), h2=hash(i+50), h3=hash(i+99); let x=h1*w, y=h2*h, al=.55, r=T*(.04+h3*.05);
    if(a.m==='float'){ x+=Math.sin(t*.6+i)*T*.7; y+=Math.cos(t*.45+i*2)*T*.5; al=.35+.35*Math.sin(t*1.3+i); }
    else if(a.m==='drift'){ x=(x+t*T*(.8+h3))%w; y+=Math.sin(t+i)*T*.2; al=.3; r*=1.4; }
    else if(a.m==='snow'){ y=(y+t*T*(.7+h3*.9))%h; x+=Math.sin(t*.8+i)*T*.5; al=.85; }
    else if(a.m==='ember'){ y=h-((h-y)+t*T*(.8+h3))%h; x+=Math.sin(t*1.4+i)*T*.4; al=.4+.5*Math.sin(t*3+i); r*=1.2; }
    else { al=.2+.7*Math.max(0,Math.sin(t*2+i*1.7)); x+=Math.sin(t*.3+i)*T*.4; }
    ctx.fillStyle='rgba('+a.c+','+al.toFixed(2)+')'; ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
  }
}
function drawIce(){
  const G=U.G, T=U.T;
  for(let r=0;r<H;r++) for(let c=0;c<W;c++){
    const ex=G.ice[r][c]; if(ex<=G.t) continue;
    const age=7-(ex-G.t), grow=Math.min(1,Math.max(0,age/.3)), melt=Math.min(1,(ex-G.t)/1.2), s=ease(grow)*melt; if(s<=0) continue;
    const [vc,vr]=VT(c,r), x=(vc+.5)*T, y=(vr+.5)*T;
    ctx.save(); ctx.translate(x,y+T*.25); ctx.scale(s,s);
    ART.glow(ctx,0,-T*.2,T*.9,'#BFEFFF',.45);
    ART.E(ctx,0,0,T*.55,T*.2,'rgba(220,245,255,.85)',0);
    [[-.22,.0,.5,.17],[.0,-.05,.85,.2],[.24,.02,.55,.16]].forEach((q,i)=>{ const hh=T*q[2], ww=T*q[3]; ART.P(ctx,[[T*q[0]-ww,T*q[1]],[T*q[0]-ww*.7,T*q[1]-hh*.7],[T*q[0],T*q[1]-hh],[T*q[0]+ww*.7,T*q[1]-hh*.7],[T*q[0]+ww,T*q[1]]],i===1?'#CFF3FF':'#9FE3FF',1.2); ART.L(ctx,T*q[0]-ww*.3,T*q[1]-hh*.2,T*q[0]-ww*.2,T*q[1]-hh*.7,1.2,'#ffffff',true); });
    ctx.restore();
  }
}
function drawPlacement(){
  const G=U.G, T=U.T, pulse=.5+.5*Math.sin(U.time*5);
  G.pads[U.me].forEach(p=>{
    const used=G.side[U.me].pieces.some(q=>q.pos&&q.pos.c===p.c&&q.pos.r===p.r); if(used) return;
    const [vc,vr]=VT(p.c,p.r), x=(vc+.5)*T, y=(vr+.5)*T;
    ART.glow(ctx,x,y,T*.9,'#FFE066',.35+.25*pulse);
    ctx.strokeStyle='rgba(255,230,90,'+(.6+.4*pulse)+')'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x,y,T*(.55+.08*pulse),0,6.2832); ctx.stroke();
  });
